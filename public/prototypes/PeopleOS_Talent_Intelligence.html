<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeopleOS — Acme Technologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --surface2:#F0F3F7; --sage:#F0F3F7;
  --green:#3657A7; --green-d:#2C488C; --pri-l:#E9EEFA; --olive:#6B7A99; --terra:#0F8B83; --teal-l:#E4F4F1; --butter:#FFF5E3;
  --ink:#202938; --ink2:#687386; --mut:#929BAA; --line:#E5E9F0; --line2:#DDE2EC;
  --ok:#23865B; --warn:#C48A27; --crit:#CE5555; --info:#5277C7;
  --shadow:0 1px 2px rgba(32,41,56,.04),0 4px 14px rgba(32,41,56,.05);
  --shadow-lg:0 10px 40px rgba(32,41,56,.14);
  --r:12px; --r-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.serif{font-family:'Inter',system-ui,sans-serif;font-weight:700;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d7d6ca;border-radius:8px;border:3px solid var(--bg)}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.mut{color:var(--ink2)}

/* ---- top utility bar ---- */
.util{height:46px;background:var(--green);color:#EAF0E9;display:flex;align-items:center;gap:16px;padding:0 20px;position:sticky;top:0;z-index:60}
.util .org{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;cursor:pointer;padding:5px 9px;border-radius:8px}
.util .org:hover{background:rgba(255,255,255,.08)}
.util .orgmark{width:22px;height:22px;border-radius:6px;background:#fff;color:var(--green);display:grid;place-items:center;font-weight:800;font-size:12px}
.util .usearch{flex:1;max-width:460px;margin:0 auto;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:7px 12px;color:#D7E2D6;font-size:12.5px;cursor:text}
.util .usearch:hover{background:rgba(255,255,255,.17)}
.util .usearch kbd{margin-left:auto;background:rgba(255,255,255,.16);border-radius:5px;padding:1px 6px;font-size:10.5px;font-family:inherit}
.util .uic{width:33px;height:33px;border-radius:8px;display:grid;place-items:center;color:#D7E2D6;position:relative}
.util .uic:hover{background:rgba(255,255,255,.1);color:#fff}
.util .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--terra);border:2px solid var(--green)}
.util .me{display:flex;align-items:center;gap:9px;padding:4px 7px 4px 4px;border-radius:9px;cursor:pointer}
.util .me:hover{background:rgba(255,255,255,.1)}
.util .ava{width:28px;height:28px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}

/* ---- primary horizontal nav ---- */
.nav{height:50px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:stretch;padding:0 14px;position:sticky;top:46px;z-index:55;gap:2px}
.navgrp{position:relative;display:flex;align-items:center}
.navgrp>button{display:flex;align-items:center;gap:7px;padding:0 14px;height:100%;font-weight:600;font-size:13.5px;color:var(--ink2);border-bottom:2.5px solid transparent}
.navgrp>button:hover{color:var(--ink)}
.navgrp.on>button{color:var(--green);border-bottom-color:var(--green)}
.navgrp>button .chev{transition:transform .15s;opacity:.5}
.navgrp:hover .chev{transform:rotate(180deg)}
.submenu{position:absolute;top:48px;left:6px;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:7px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:.15s;z-index:80}
.navgrp:hover .submenu{opacity:1;visibility:visible;transform:translateY(0)}
.submenu a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;font-weight:500;font-size:13.5px;color:var(--ink)}
.submenu a:hover{background:var(--sage)}
.submenu a.on{background:var(--green);color:#fff}
.submenu a .si{width:18px;display:grid;place-items:center;opacity:.65}
.submenu a.on .si{opacity:1}

/* ---- layout ---- */
.wrap{max-width:1340px;margin:0 auto;padding:30px 30px 80px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:26px;flex-wrap:wrap}
.page-head .eyebrow{margin-bottom:9px}
.page-head h1{font-size:30px;line-height:1.14;letter-spacing:-.022em;max-width:640px;font-weight:700}
.page-head p.sub{color:var(--ink2);font-size:14.5px;margin-top:10px;max-width:540px}
.head-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;background:var(--surface);border:1px solid var(--line2);color:var(--ink);transition:.12s;white-space:nowrap}
.btn:hover{border-color:var(--olive);background:#fff}
.btn.pri{background:var(--green);color:#fff;border-color:var(--green)}
.btn.pri:hover{background:var(--green-d)}
.btn.terra{background:var(--terra);color:#fff;border-color:var(--terra)}
.btn.terra:hover{filter:brightness(.94)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.gho{background:transparent;border-color:transparent}
.btn.gho:hover{background:var(--sage);border-color:transparent}
.chip-f{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line2);font-weight:600;font-size:12.5px;color:var(--ink2)}
.chip-f:hover{border-color:var(--olive);color:var(--ink)}
.chip-f.active{border-color:var(--green);color:var(--green);background:var(--pri-l)}
/* filter popover */
.fwrap{position:relative}
.fmenu{position:absolute;top:calc(100% + 6px);left:0;min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-lg);padding:6px;z-index:70;display:none}
.fmenu.on{display:block}
.fmenu .fmhead{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);padding:7px 10px 4px}
.fmenu button{display:flex;width:100%;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;text-align:left;color:var(--ink)}
.fmenu button:hover{background:var(--sage)}
.fmenu button.sel{color:var(--green);font-weight:600;background:var(--pri-l)}
.fmenu button.sel::after{content:'✓';margin-left:auto;font-size:12px}
/* stat clusters */
.cluster .stat-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.cluster .stat-row:last-child{border-bottom:none;padding-bottom:2px}
.cluster .stat-row:first-of-type{padding-top:6px}
.cluster .stat-k{font-size:13px;color:var(--ink2);font-weight:500}
.cluster .stat-rt{display:flex;align-items:baseline;gap:10px}
.cluster .stat-v{font-size:25px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cluster .delta{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.cluster .delta.up{color:var(--ok)}.cluster .delta.down{color:var(--crit)}.cluster .delta.flat{color:var(--mut)}

/* cards & surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.sec-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-label h3{font-size:15px;font-weight:700}
.grid{display:grid;gap:18px}

/* pills / tags */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.01em}
.pill.green{background:var(--pri-l);color:var(--green)}
.pill.sage{background:#EEF2F8;color:#5a6a86}
.pill.terra{background:var(--teal-l);color:#0C7169}
.pill.butter{background:#FFF5E3;color:var(--warn)}
.pill.ok{background:#E7F5ED;color:var(--ok)}
.pill.warn{background:#FFF5E3;color:var(--warn)}
.pill.crit{background:#FCECEC;color:var(--crit)}
.pill.ink{background:#EDEFF3;color:var(--ink2)}
.dotpill{width:7px;height:7px;border-radius:50%;display:inline-block}

/* avatars */
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;background:var(--olive)}
.av.sm{width:30px;height:30px;font-size:11.5px}
.av.md{width:40px;height:40px;font-size:14px}
.av.lg{width:72px;height:72px;font-size:24px}
.av.c0{background:#4C6FC2}.av.c1{background:var(--terra)}.av.c2{background:#5277C7}.av.c3{background:#6B7A99}.av.c4{background:#3657A7}.av.c5{background:#2C488C}

/* tables */
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#FBFAF4}
.tbl th.num,.tbl td.num{text-align:right}

/* bars & meters */
.meter{height:7px;border-radius:999px;background:var(--line);overflow:hidden}
.meter>span{display:block;height:100%;border-radius:999px;background:var(--green)}
.meter.terra>span{background:var(--terra)}
.meter.warn>span{background:var(--warn)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(37,42,38,.38);opacity:0;visibility:hidden;transition:.2s;z-index:90}
.scrim.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;height:100%;width:540px;max-width:94vw;background:var(--bg);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1);z-index:95;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.drawer .dhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px;background:var(--surface)}
.drawer .dbody{flex:1;overflow:auto;padding:22px}
.drawer .dfoot{padding:14px 22px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:9px;flex-wrap:wrap}
.xbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.xbtn:hover{background:var(--sage);color:var(--ink)}

/* modal */
.modal-scrim{position:fixed;inset:0;background:rgba(37,42,38,.42);display:none;align-items:center;justify-content:center;z-index:100;padding:24px}
.modal-scrim.on{display:flex}
.modal{background:var(--bg);border-radius:18px;box-shadow:var(--shadow-lg);width:520px;max-width:96vw;max-height:90vh;overflow:auto}
.modal .mhead{padding:20px 24px 0}
.modal .mbody{padding:16px 24px}
.modal .mfoot{padding:14px 24px 22px;display:flex;gap:10px;justify-content:flex-end}
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:12.5px;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--surface)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green)}
.field.err input,.field.err select{border-color:var(--crit)}
.field .emsg{color:var(--crit);font-size:11.5px;margin-top:5px;display:none}
.field.err .emsg{display:block}

/* toast */
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:9px;align-items:center}
.toast{background:var(--green);color:#fff;padding:11px 18px;border-radius:11px;box-shadow:var(--shadow-lg);font-weight:600;font-size:13px;display:flex;align-items:center;gap:10px;animation:tin .2s}
.toast.terra{background:var(--terra)}.toast.warn{background:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* command palette */
.cmd-scrim{position:fixed;inset:0;background:rgba(37,42,38,.4);display:none;align-items:flex-start;justify-content:center;z-index:110;padding-top:11vh}
.cmd-scrim.on{display:flex}
.cmd{width:640px;max-width:94vw;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden}
.cmd .cin{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.cmd .cin input{flex:1;border:none;font-size:17px;background:none}
.cmd .cin input:focus{outline:none}
.cmd .cres{max-height:52vh;overflow:auto;padding:8px}
.cmd .cgrp{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);padding:10px 12px 5px}
.cmd .cres a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px}
.cmd .cres a.sel,.cmd .cres a:hover{background:var(--sage)}
.cmd .cres .ci{width:30px;height:30px;border-radius:7px;background:var(--sage);display:grid;place-items:center;color:var(--green)}
.cmd .cmeta{margin-left:auto;font-size:11.5px;color:var(--ink2)}
.cmd .cfoot{padding:9px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink2);display:flex;gap:16px}

/* misc */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{padding:10px 15px;font-weight:600;font-size:13.5px;color:var(--ink2);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--green);border-bottom-color:var(--green)}
.tabs button:hover{color:var(--ink)}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px}
.spark span{flex:1;background:var(--olive);border-radius:2px;opacity:.55;min-height:3px}
.empty{text-align:center;padding:50px 20px;color:var(--ink2)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink2);font-size:12.5px}
.kv .v{font-weight:600;font-size:13px;text-align:right}
.ai-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px;background:var(--pri-l);color:var(--green);font-size:10.5px;font-weight:600;letter-spacing:.02em}
.ai-spark{width:13px;height:13px}
.hl{background:var(--pri-l);border-radius:3px;padding:0 3px}
.load-dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--olive);margin:0 2px;animation:ld 1s infinite}
.load-dots span:nth-child(2){animation-delay:.15s}.load-dots span:nth-child(3){animation-delay:.3s}
@keyframes ld{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
@media(max-width:860px){
  .nav{overflow-x:auto}.wrap{padding:22px 16px 70px}.page-head h1{font-size:26px}
  .util .usearch{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer"></aside>
<div class="modal-scrim" id="modalScrim"><div class="modal" id="modal"></div></div>
<div class="cmd-scrim" id="cmdScrim"><div class="cmd" id="cmdBox"></div></div>
<div class="toasts" id="toasts"></div>
<script>

/* ========================================================================
   PeopleOS — shared mock database + state layer
   All modules read/write this single model. Persisted to localStorage.
   ======================================================================== */
'use strict';

const LS_KEY = 'peopleos_state_v1';

/* ---- static reference data ---------------------------------------------- */
const DEPARTMENTS = [

const SKILLS = [

  // emerging
  {id:'genai',name:'Generative AI',cat:'Emerging',crit:'Critical',demand:28},
  {id:'prompteng',name:'Prompt Engineering',cat:'Emerging',crit:'High',demand:16},

  {id:'platformeng',name:'Platform Engineering',cat:'Emerging',crit:'High',demand:15},
];
const SKILL_BY_ID = Object.fromEntries(SKILLS.map(s=>[s.id,s]));
const PROF = ['Beginner','Intermediate','Advanced','Expert'];

/* department → skill affinity, used when seeding employee skills */
const DEPT_SKILLS = {
  eng:['cloudarch','k8s','golang','react','python','devops','security','platformeng','sql','genai'],
  prod:['prodstrat','roadmap','prodanalytics','stakeholder','gtm','genai'],
  design:['uidesign','uxresearch','contentdes','prodanalytics'],
  cs:['csmgmt','stakeholder','negotiation','coaching'],
  sales:['gtm','negotiation','salesops','stakeholder','demandgen'],
  mktg:['demandgen','gtm','contentdes','dataviz','genai'],
  data:['python','sql','dataeng','ml','dataviz','prompteng'],
  ops:['peoplelead','orgdesign','stakeholder','coaching','finmodel'],
};

/* ---- deterministic PRNG so the dataset is stable across reloads --------- */
let _seed = 20260411;
function rnd(){ _seed = (_seed*1664525+1013904223)%4294967296; return _seed/4294967296; }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
function pickN(a,n){ const c=[...a],o=[]; while(o.length<n&&c.length) o.push(c.splice(Math.floor(rnd()*c.length),1)[0]); return o; }
function ri(lo,hi){ return lo+Math.floor(rnd()*(hi-lo+1)); }

const FIRST = ['Aarav','Diya','Kabir','Ananya','Vihaan','Isha','Rohan','Meera','Arjun','Saanvi','Dev','Riya','Advait','Nisha','Kiran','Tara','Neil','Aditi','Yash','Pooja',
 'Liam','Emma','Noah','Olivia','Lucas','Mia','Elias','Clara','Jonas','Lena','Mateo','Sofia','Hugo','Alba','Leon','Greta','Finn','Maja','Theo','Nora',
 'Wei','Mei','Jun','Hana','Ken','Yuki','Min','Sang','Chen','Li','Marcus','Grace','Daniel','Hannah','Samuel','Ruth','Caleb','Naomi','Ethan','Zoe'];

/* ---- build 120 employees ------------------------------------------------ */
function buildEmployees(){
  const emps=[]; let n=1;
  // department heads first (hero managers)
  const heads={};
  DEPARTMENTS.forEach(d=>{
    const [fn,...ln]=d.head.split(' ');
    const id='E'+String(n).padStart(4,'0');
    heads[d.id]=id;
    emps.push(makeEmp(id, fn, ln.join(' '), d.id, DESIG[d.id][DESIG[d.id].length-1], null, 'Active', ri(40,84)));
    n++;
  });
  // fill the rest
  for(; n<=120; n++){
    const d=pick(DEPARTMENTS);
    const id='E'+String(n).padStart(4,'0');
    const desig=pick(DESIG[d.id].slice(0,-1));
    emps.push(makeEmp(id, pick(FIRST), pick(LAST), d.id, desig, heads[d.id], pick(STATUSES), ri(1,60)));
  }
  // make sure hero candidate Aarav Menon exists & is strong
  const aarav=emps.find(e=>e.id==='E0011') || emps[10];
  aarav.first='Aarav'; aarav.last='Menon'; aarav.dept='prod'; aarav.desig='Product Analyst';
  aarav.loc='Bengaluru'; aarav.aspire='Product Management'; aarav.status='Active';
  aarav.mgr=heads['prod']; aarav.tenure=38;
  aarav.skills=[['prodanalytics',3,true],['stakeholder',3,true],['prodstrat',2,false],['roadmap',2,false],['sql',3,true],['dataviz',3,true],['gtm',2,false]];
  aarav.name=aarav.first+' '+aarav.last;
  return emps;
}
function makeEmp(id, first, last, dept, desig, mgr, status, tenure){
  const deptSkills=DEPT_SKILLS[dept];
  const ns=ri(3,6);
  const chosen=pickN(deptSkills, Math.min(ns,deptSkills.length));
  const skills=chosen.map(sid=>[sid, ri(1,4), rnd()>0.35]);
  const loc=pick(LOCATIONS);
  const aspire=rnd()>0.42 ? pick(ASPIRE.slice(0,-1)) : '—';
  const perf=pick(['Exceeds','Meets','Meets','Meets','Developing','Outstanding']);
  return {
    id, first, last, name:first+' '+last, dept, desig, mgr, loc, status,
    tenure, join: monthsAgo(tenure), email:(first+'.'+last).toLowerCase().replace(/[^a-z.]/g,'')+'@acmetech.com',
    skills, aspire, perf,
    engagement: ri(48,96),
    exploring: aspire!=='—' && rnd()>0.55,
  };
}

function seedState(){
  _seed=20260411;
  const employees=buildEmployees();
  return {
    employees,
    leave: buildLeave(employees),
    hr: buildHR(employees),
    onboarding: buildOnboarding(employees),
    succession: buildSuccession(employees),
    goals: JSON.parse(JSON.stringify(GOALS)),
    insights: INSIGHTS.map(i=>({...i, reviewed:false})),
    shortlist: {},            // roleId -> [empId]
    applications: [],         // {role, emp, stage}
    inferred: buildInferred(employees),
    audit: [],
    reviewedCount: 0,
  };
}
function buildInferred(emps){
  // AI-suggested skills awaiting validation
  const out=[];
  const samples=pickN(emps.filter(e=>e.status==='Active'),8);
  samples.forEach((e,i)=>{
    const have=e.skills.map(s=>s[0]);
    const cand=DEPT_SKILLS[e.dept].filter(s=>!have.includes(s));
    if(!cand.length) return;
    const sid=pick(cand);
    out.push({id:'INF-'+(400+i), emp:e.id, skill:sid, conf:ri(62,94),
      evidence:pick(['Named in 3 project retrospectives','Referenced in manager feedback','Completed relevant learning path','Tagged in 5 merged pull requests']),
      status:'Pending'});
  });
  return out;
}

/* ---- state load / save ------------------------------------------------- */
let STATE;
function loadState(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ STATE=JSON.parse(raw); return; } }catch(e){}
  STATE=seedState();
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){} }
function resetState(){ STATE=seedState(); saveState(); }
function audit(action, detail){
  STATE.audit.unshift({ts:new Date().toISOString(), who:'John Doe', action, detail});
  if(STATE.audit.length>200) STATE.audit.pop();
  saveState();
}
function empById(id){ return STATE.employees.find(e=>e.id===id); }
function deptName(id){ const d=DEPARTMENTS.find(x=>x.id===id); return d?d.name:id; }

function ovDelta(key,val){
  const good={total:1,active:1,fill:1,critcov:1,tenure:1,eng:1,attr:0,open:2}[key];
  if(OV_SCOPE.bu==='all'){const q={total:'+3.1%',active:'+1.4%',open:'+12',attr:'+0.6pt',fill:'+4pt',critcov:'−2pt',tenure:'+0.1',eng:'+2'}[key];
    const dir={total:'up',active:'up',open:'flat',attr:'down',fill:'up',critcov:'down',tenure:'up',eng:'up'}[key];
    return `<span class="delta ${dir}">${dir!=='flat'?icon(dir,12):''}${q} <span class="mut" style="font-weight:500">vs last qtr</span></span>`;}
  const o=ORG_METRICS[key];const diff=+(val-o).toFixed(1);const sign=diff>0?'+':'';
  const unit=(key==='attr'||key==='fill'||key==='critcov')?'pt':'';
  if(good===2||diff===0)return `<span class="delta flat">${sign}${diff}${unit} <span class="mut" style="font-weight:500">vs org</span></span>`;
  const better=(good===1&&diff>0)||(good===0&&diff<0);
  return `<span class="delta ${better?'up':'down'}">${icon(diff>0?'up':'down',12)}${sign}${diff}${unit} <span class="mut" style="font-weight:500">vs org</span></span>`;

/* graded skill coverage for a team on one skill (0–96), smooth not binary */
function skillCoverage(emps, skillId, deptId){
  if(!emps.length) return 0;
  const holders=emps.filter(x=>x.skills.some(k=>k[0]===skillId));
  const hfrac=holders.length/emps.length;
  const avgProf=holders.length?holders.reduce((a,x)=>a+x.skills.find(k=>k[0]===skillId)[1],0)/holders.length/4:0;
  const inDomain=(DEPT_SKILLS[deptId]||[]).includes(skillId);
  const pop=(SKILL_BY_ID[skillId].demand||20)/46;           // org-wide prevalence of the skill
  let h=0;const key=deptId+skillId;for(const ch of key)h=(h*31+ch.charCodeAt(0))%101;const jit=(h/101-0.5)*20;
  let raw;
  if(inDomain){ raw=Math.max(hfrac*50+avgProf*42,48)+8+jit; return Math.max(46,Math.min(96,Math.round(raw))); }
  raw=14+pop*24+hfrac*18+jit;                                // cross-functional coverage gradient
  return Math.max(12,Math.min(52,Math.round(raw)));
}

let SK_CAT='All';
function skillStats(){
  const e=STATE.employees;
  const mapped=SKILLS.length;
  const critical=SKILLS.filter(s=>s.crit==='Critical').length;
  // shortage = demand exceeds advanced+ holders
  let shortage=0;
  SKILLS.forEach(s=>{const holders=e.filter(x=>x.skills.some(k=>k[0]===s.id&&k[1]>=3)).length;if(holders*20<s.demand)shortage++;});
  const incomplete=e.filter(x=>x.skills.length<4).length;
  return {mapped,critical,shortage,incomplete};
}

let MKT_ROLE=null;
function matchScore(emp,role){
  // deterministic explainable match across role's required skills
  const dims=role.req.map(([sid,need])=>{
    const have=emp.skills.find(k=>k[0]===sid);
    const lvl=have?have[1]:0;
    const pct=Math.min(100,Math.round((lvl/need)*100));
    return {skill:SKILL_BY_ID[sid].name,pct:Math.max(20,pct)};
  });
  // aspiration + domain bonus
  const overall=Math.round(dims.reduce((a,d)=>a+d.pct,0)/dims.length);
  return {dims,overall:Math.min(98,overall)};
}
function candidatesFor(role){
  return STATE.employees.filter(e=>e.status==='Active'&&e.dept!==null)
    .map(e=>({emp:e,...matchScore(e,role)}))
    .filter(c=>c.overall>=55)
    .sort((a,b)=>b.overall-a.overall).slice(0,8);
}

     </div>

     <div id="goalTree">${tree}</div>`;
}
function buildGoalTree(){
  const roots=STATE.goals.filter(g=>!g.parent);
  function node(g,depth){
    const kids=STATE.goals.filter(x=>x.parent===g.id);
    const lvColor={Organisation:'green',Department:'sage',Individual:'butter'}[g.level];
    return `<div style="margin-left:${depth*26}px;margin-bottom:10px"><div class="card pad" style="cursor:pointer;border-left:3px solid ${g.status==='At risk'?'var(--warn)':'var(--green)'}" onclick="goalDetail('${g.id}')">
      <div style="display:flex;align-items:center;gap:10px"><span class="pill ${lvColor}" style="font-size:10px">${esc(g.level)}</span>
        <div style="flex:1"><div style="font-weight:700;font-size:14px">${esc(g.title)}</div><div class="mut" style="font-size:11.5px">${esc(g.owner)} · due ${fmtDate(g.due)}</div></div>
        <div style="width:120px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span class="mut">${g.prog}%</span>${sevPill(g.status)}</div><div class="meter ${g.prog<40?'warn':''}"><span style="width:${g.prog}%"></span></div></div></div></div>
      ${kids.map(k=>node(k,depth+1)).join('')}</div>`;
  }
  return roots.map(r=>node(r,0)).join('');
}
function goalDetail(id){const g=STATE.goals.find(x=>x.id===id);const parent=g.parent?STATE.goals.find(x=>x.id===g.parent):null;
  openDrawer(`<div class="dhead"><div style="flex:1"><span class="pill ${{Organisation:'green',Department:'sage',Individual:'butter'}[g.level]}" style="font-size:10px">${esc(g.level)}</span><h3 class="serif" style="font-size:21px;margin-top:8px">${esc(g.title)}</h3><div class="mut" style="font-size:12.5px;margin-top:3px">${esc(g.owner)} · due ${fmtDate(g.due)}</div></div><button class="xbtn" onclick="closeDrawer()">${icon('x',18)}</button></div>
    <div class="dbody">

      ${parent?`<div class="lbl" style="margin-bottom:8px">Aligned to</div><div class="card pad" style="margin-bottom:16px;cursor:pointer" onclick="goalDetail('${parent.id}')"><div style="font-weight:600;font-size:13px">${esc(parent.title)}</div><div class="mut" style="font-size:11.5px">${esc(parent.level)} · ${esc(parent.owner)}</div></div>`:''}

}
function updateGoal(id,delta){const g=STATE.goals.find(x=>x.id===id);g.prog=Math.max(0,Math.min(100,g.prog+delta));

let ASK_MSGS=[];
const ASK_SUGG=['Which departments have the largest critical skills shortages?','Which open positions have potential internal candidates?','How has voluntary attrition changed over the last six months?','Which employees have overdue development plans?'];
function vAssistant(){
  $('#view').innerHTML=
    pageHead('Intelligence','PeopleOS Copilot','Ask questions of your workforce data. Every answer shows its reasoning and evidence.',

          <input id="askIn" placeholder="Ask about skills, attrition, mobility, succession…" style="flex:1;border:1px solid var(--line2);border-radius:10px;padding:11px 14px;outline:none" onkeydown="if(event.key==='Enter')askSend(this.value)">
          <button class="btn pri" onclick="askSend(document.getElementById('askIn').value)">${icon('arrow',16)} Ask</button>
        </div>
      </div>`;
  const sc=$('#askScroll');if(sc)sc.scrollTop=sc.scrollHeight;
}
function askWelcome(){
  return `<div style="text-align:center;padding:24px 10px"><div style="width:52px;height:52px;border-radius:14px;background:var(--green);display:grid;place-items:center;margin:0 auto 14px;color:#fff">${sparkSvg()}</div>
    <h3 class="serif" style="font-size:22px;margin-bottom:8px">How can I help with your people data?</h3>
    <p class="mut" style="max-width:420px;margin:0 auto 20px">I interpret your question, identify the datasets, show my steps and evidence, and suggest next actions you control.</p>
    <div style="display:flex;flex-direction:column;gap:8px;max-width:520px;margin:0 auto">${ASK_SUGG.map(q=>`<button class="card pad" style="text-align:left;cursor:pointer;font-size:13.5px;font-weight:600" onclick="askSend(this.dataset.q)" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div></div>`;
}
function askBubble(m){
  if(m.role==='user')return `<div style="align-self:flex-end;max-width:76%"><div style="background:var(--green);color:#fff;padding:11px 15px;border-radius:14px 14px 4px 14px;font-size:13.5px">${esc(m.text)}</div></div>`;
  return `<div style="align-self:flex-start;max-width:88%;display:flex;gap:11px">
    <div style="width:30px;height:30px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:#fff;flex:none">${sparkSvg()}</div>
    <div style="flex:1">${m.html}</div></div>`;
}
function askSend(q){
  q=(q||'').trim();if(!q)return;
  if(!ASK_MSGS.length)$('#askScroll').innerHTML='';
  ASK_MSGS.push({role:'user',text:q});
  const sc=$('#askScroll');sc.insertAdjacentHTML('beforeend',askBubble(ASK_MSGS[ASK_MSGS.length-1]));
  $('#askIn').value='';
  const loadId='ld'+Date.now();
  sc.insertAdjacentHTML('beforeend',`<div id="${loadId}" style="align-self:flex-start;display:flex;gap:11px"><div style="width:30px;height:30px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:#fff">${sparkSvg()}</div><div class="load-dots" style="padding:8px 0"><span></span><span></span><span></span></div></div>`);
  sc.scrollTop=sc.scrollHeight;
  setTimeout(()=>{const ld=document.getElementById(loadId);if(ld)ld.remove();
    const ans=askAnswer(q);ASK_MSGS.push({role:'ai',html:ans});
    sc.insertAdjacentHTML('beforeend',askBubble(ASK_MSGS[ASK_MSGS.length-1]));sc.scrollTop=sc.scrollHeight;
  },700);
}
function askAnswer(q){
  const l=q.toLowerCase();let ins=null;
  if(l.includes('skill')||l.includes('shortage'))ins=STATE.insights[0];
  else if(l.includes('internal')||l.includes('candidate')||l.includes('position')||l.includes('role'))ins=STATE.insights[1];
  else if(l.includes('attrition')||l.includes('retention')||l.includes('leav'))ins=STATE.insights[2];
  else if(l.includes('development')||l.includes('aspiration')||l.includes('career'))ins=STATE.insights[3];
  if(ins){
    return `<div class="card pad" style="margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">${sevPill(ins.sev)}<span class="mut" style="font-size:11px">${esc(ins.conf)} confidence · ${esc(ins.fresh)}</span></div>
      <p style="font-size:13.5px;line-height:1.55;margin-bottom:12px">${esc(ins.expl)}</p>
      <div class="lbl" style="margin-bottom:6px">Supporting evidence</div>
      <div style="background:var(--sage);border-radius:9px;padding:11px 13px;margin-bottom:12px">${ins.data.map(d=>`<div style="font-size:12.5px;padding:3px 0">· ${esc(d)}</div>`).join('')}</div>
      <div class="lbl" style="margin-bottom:6px">Suggested next step</div>
      <p style="font-size:13px;line-height:1.5;margin-bottom:12px">${esc(ins.rec)}</p>

  }

/* ======================================================================
   GLOBAL SEARCH / COMMAND PALETTE (⌘K)
   ====================================================================== */
let CMD_SEL=0,CMD_RESULTS=[];
function openCmd(){$('#cmdScrim').classList.add('on');$('#cmdBox').innerHTML=cmdShell('');setTimeout(()=>{const i=$('#cmdInput');if(i)i.focus();},40);cmdSearch('');}
function closeCmd(){$('#cmdScrim').classList.remove('on');}
$('#cmdScrim')&&$('#cmdScrim').addEventListener('click',e=>{if(e.target.id==='cmdScrim')closeCmd();});
function cmdShell(q){
  return `<div class="cin">${icon('search',19)}<input id="cmdInput" placeholder="Search employees, skills, roles, goals, policies…" value="${esc(q)}" oninput="cmdSearch(this.value)" onkeydown="cmdKey(event)"><kbd style="background:var(--sage);border-radius:5px;padding:2px 7px;font-size:11px">ESC</kbd></div>
    <div class="cres" id="cmdRes"></div>
    <div class="cfoot"><span>↑↓ navigate</span><span>↵ open</span><span>esc close</span></div>`;
}
function cmdSearch(q){
  q=q.trim().toLowerCase();CMD_SEL=0;const res=[];
  if(!q){
    res.push({grp:'Jump to',ic:'overview',label:'People Overview',meta:'Discover',act:"navigate('overview')"});
    res.push({grp:'Jump to',ic:'market',label:'Internal Talent Marketplace',meta:'Talent',act:"navigate('market')"});
    res.push({grp:'Jump to',ic:'assistant',label:'Ask about your workforce',meta:'Intelligence',act:"navigate('assistant')"});
    res.push({grp:'Jump to',ic:'skills',label:'Skills Intelligence',meta:'Talent',act:"navigate('skills')"});
  }else{
    STATE.employees.filter(e=>e.name.toLowerCase().includes(q)||e.email.toLowerCase().includes(q)||e.id.toLowerCase().includes(q)||e.desig.toLowerCase().includes(q)).slice(0,5).forEach(e=>res.push({grp:'Employees',ic:'directory',label:e.name,meta:e.desig+' · '+deptName(e.dept),act:`closeCmd();openEmp('${e.id}')`}));
    SKILLS.filter(s=>s.name.toLowerCase().includes(q)).slice(0,4).forEach(s=>res.push({grp:'Skills',ic:'skills',label:s.name,meta:s.cat+' · '+s.crit,act:`closeCmd();navigate('skills');setTimeout(()=>skillDetail('${s.id}'),150)`}));
    OPPORTUNITIES.filter(o=>o.title.toLowerCase().includes(q)||o.team.toLowerCase().includes(q)).slice(0,4).forEach(o=>res.push({grp:'Open roles',ic:'market',label:o.title,meta:o.team+' · '+o.loc,act:`closeCmd();navigate('market');setTimeout(()=>selRole('${o.id}'),150)`}));
    STATE.goals.filter(g=>g.title.toLowerCase().includes(q)).slice(0,3).forEach(g=>res.push({grp:'Goals',ic:'goals',label:g.title,meta:g.level+' · '+g.owner,act:`closeCmd();navigate('goals')`}));
    DEPARTMENTS.filter(d=>d.name.toLowerCase().includes(q)).slice(0,3).forEach(d=>res.push({grp:'Departments',ic:'org',label:d.name,meta:'Department',act:`closeCmd();DIR={q:'',dept:'${d.id}',loc:'',status:'',sort:'name',page:1};navigate('directory')`}));
    POLICIES.filter(p=>p.name.toLowerCase().includes(q)).slice(0,3).forEach(p=>res.push({grp:'Policies',ic:'policy',label:p.name,meta:p.cat,act:`closeCmd();navigate('policy')`}));
    NAV.forEach(gp=>gp.items.forEach(it=>{if(it[1].toLowerCase().includes(q))res.push({grp:'Navigate',ic:it[0],label:it[1],meta:gp.grp,act:`closeCmd();navigate('${it[2]}')`});}));
  }
  CMD_RESULTS=res;
  const groups={};res.forEach((r,i)=>{(groups[r.grp]=groups[r.grp]||[]).push({...r,i});});
  const html=Object.keys(groups).length?Object.entries(groups).map(([g,arr])=>`<div class="cgrp">${esc(g)}</div>${arr.map(r=>`<a class="${r.i===CMD_SEL?'sel':''}" onclick="${r.act}"><span class="ci">${icon(r.ic,16)}</span><span style="font-weight:600;font-size:13.5px">${esc(r.label)}</span><span class="cmeta">${esc(r.meta)}</span></a>`).join('')}`).join(''):'<div class="empty" style="padding:30px">No results. Try a name, skill or role.</div>';
  const box=$('#cmdRes');if(box)box.innerHTML=html;
}
function cmdKey(e){
  if(e.key==='Escape'){closeCmd();return;}
  if(e.key==='ArrowDown'){e.preventDefault();CMD_SEL=Math.min(CMD_RESULTS.length-1,CMD_SEL+1);cmdHi();}
  if(e.key==='ArrowUp'){e.preventDefault();CMD_SEL=Math.max(0,CMD_SEL-1);cmdHi();}
  if(e.key==='Enter'){const r=CMD_RESULTS[CMD_SEL];if(r){const f=new Function(r.act);f();}}
}
function cmdHi(){document.querySelectorAll('#cmdRes a').forEach((a,i)=>a.classList.toggle('sel',i===CMD_SEL));const sel=document.querySelector('#cmdRes a.sel');if(sel)sel.scrollIntoView({block:'nearest'});}

/* ======================================================================
   INIT
   ====================================================================== */
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd();}
  if(e.key==='Escape'){closeModal();closeDrawer();}
});
document.addEventListener('click',e=>{if(!e.target.closest('.fwrap'))document.querySelectorAll('.fmenu.on').forEach(m=>m.classList.remove('on'));});
loadState();
document.getElementById('app').innerHTML=renderShell();
renderView();

</script>
