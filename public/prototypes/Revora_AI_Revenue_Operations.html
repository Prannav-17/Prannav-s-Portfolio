<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revora AI — Intelligent Revenue Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#F6F7FB;--surface:#FFFFFF;--surface-2:#FBFBFD;
  --side:#151B2B;--side-2:#1E2638;--side-active:#28334A;--side-hair:rgba(255,255,255,.07);
  --pri:#635BFF;--pri-hover:#514BE0;--pri-soft:#EEEDFF;--pri-tint:#F5F4FF;--pri-ring:rgba(99,91,255,.14);
  --teal:#14B8A6;--teal-soft:#D5F5F0;
  --green:#16A34A;--green-soft:#DCFCE7;--amber:#F59E0B;--amber-soft:#FEF3C7;--red:#DC4444;--red-soft:#FEE2E2;
  --text:#171C2D;--text-2:#737B8C;--text-3:#9CA3AF;
  --border:#E6E8EF;--border-2:#F0F1F3;
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 4px 12px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.12);
}
html,body{height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;}
.shell{display:flex;height:100vh;overflow:hidden;}
::selection{background:var(--pri-ring);}

/* ============ SIDEBAR ============ */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:244px;background:var(--side);display:flex;flex-direction:column;transition:width .18s ease,box-shadow .18s ease;z-index:40;overflow:hidden;}
.hide-collapse{white-space:nowrap;transition:opacity .13s ease;}
.shell.rail-collapsed .sidebar{width:64px;}
.shell.rail-collapsed .sidebar:hover{width:244px;box-shadow:var(--shadow-lg);}
.shell.rail-collapsed .sidebar:not(:hover) .hide-collapse{display:none;}
.shell.rail-collapsed .sidebar:not(:hover) .nav-item{justify-content:center;padding:9px 0;}
.shell.rail-collapsed .sidebar:not(:hover) .nav-item.active::before{display:none;}
.shell.rail-collapsed .sidebar:not(:hover) .ws-card{justify-content:center;padding:10px 0;}
.shell.rail-collapsed .sidebar:not(:hover) .brand{justify-content:center;}
.shell.rail-collapsed .sidebar:not(:hover) .profile{justify-content:center;padding-left:0;padding-right:0;}
.shell.rail-collapsed .sidebar:not(:hover) .nav-group-title{text-align:center;padding-left:0;padding-right:0;overflow:hidden;}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#635BFF,#8B84FF);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(99,91,255,.4);}
.brand-mark svg{width:17px;height:17px;color:#fff;}
.brand-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em;}
.ws-wrap{padding:0 12px 10px;}
.ws-card{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--side-2);cursor:pointer;transition:background .15s;border:1px solid transparent;}
.ws-card:hover{background:var(--side-active);}
.ws-logo{width:26px;height:26px;border-radius:6px;background:#fff;color:var(--side);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
.ws-name{font-size:13px;font-weight:600;color:#fff;line-height:1.1;}
.ws-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:1px;}
.ws-chev{margin-left:auto;color:rgba(255,255,255,.4);}
.nav-scroll{flex:1;overflow-y:auto;padding:4px 12px;}
.nav-scroll::-webkit-scrollbar{width:0;}
.nav-group{margin-bottom:14px;}
.nav-group-title{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.34);padding:4px 10px 6px;letter-spacing:.06em;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;color:rgba(255,255,255,.62);font-size:13px;font-weight:500;transition:all .13s;margin-bottom:1px;position:relative;}
.nav-item:hover{background:var(--side-2);color:rgba(255,255,255,.92);}
.nav-item.active{background:var(--side-active);color:#fff;}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--pri);border-radius:0 3px 3px 0;}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item .nav-badge{margin-left:auto;font-size:10.5px;font-weight:600;background:var(--pri);color:#fff;border-radius:99px;padding:1px 7px;min-width:18px;text-align:center;}
.nav-item .nav-badge.amber{background:var(--amber);}
.profile{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--side-hair);cursor:pointer;transition:background .15s;}
.profile:hover{background:var(--side-2);}
.avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;color:#fff;background:linear-gradient(135deg,#635BFF,#14B8A6);}
.profile-name{font-size:12.5px;font-weight:600;color:#fff;line-height:1.1;}
.profile-role{font-size:11px;color:rgba(255,255,255,.45);margin-top:1px;}

/* ============ MAIN ============ */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;margin-left:244px;transition:margin-left .18s ease;}
.shell.rail-collapsed .main{margin-left:64px;}
.topbar{display:flex;align-items:center;gap:14px;padding:0 24px;height:58px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);flex-shrink:0;z-index:20;}
.hamburger{width:32px;height:32px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);transition:background .15s;}
.hamburger:hover{background:var(--bg);}
.crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-3);}
.crumb b{color:var(--text);font-weight:600;}
.topbar-spacer{flex:1;}
.search-bar{display:flex;align-items:center;gap:9px;padding:0 12px;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text-3);cursor:pointer;min-width:300px;font-size:13px;transition:all .15s;}
.search-bar:hover{border-color:#D1D5DB;background:#fff;}
.search-bar kbd{margin-left:auto;font-size:10.5px;background:#fff;border:1px solid var(--border);padding:1px 6px;border-radius:4px;font-family:inherit;color:var(--text-2);box-shadow:var(--shadow-sm);}
.ask-btn{display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--radius-sm);background:var(--pri);color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:all .15s;box-shadow:0 1px 2px rgba(99,91,255,.3);}
.ask-btn:hover{background:var(--pri-hover);box-shadow:0 2px 8px rgba(99,91,255,.35);}
.ask-btn svg{width:15px;height:15px;}
.icon-btn{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);position:relative;transition:all .15s;border:1px solid transparent;}
.icon-btn:hover{background:var(--bg);color:var(--text);}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #fff;}
.content{flex:1;overflow-y:auto;}
.content-inner{max-width:1360px;margin:0 auto;padding:24px 28px 64px;}

/* ============ PAGE HEADER ============ */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;}
.page-title{font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--text);}
.page-sub{font-size:13.5px;color:var(--text-2);margin-top:3px;}
.page-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}

/* ============ CONTROLS ============ */
.ctrl{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
.ctrl:hover{border-color:#D1D5DB;color:var(--text);}
.ctrl svg{width:14px;height:14px;}
.ctrl.active{background:var(--pri-tint);border-color:var(--pri);color:var(--pri);}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);overflow:hidden;}
.seg button{height:32px;padding:0 13px;border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--text-2);cursor:pointer;transition:all .12s;}
.seg button+button{border-left:1px solid var(--border);}
.seg button.active{background:var(--pri);color:#fff;}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;white-space:nowrap;}
.btn svg{width:15px;height:15px;}
.btn-pri{background:var(--pri);color:#fff;box-shadow:0 1px 2px rgba(99,91,255,.3);}
.btn-pri:hover{background:var(--pri-hover);}
.btn-ghost{background:var(--surface);color:var(--text-2);border:1px solid var(--border);}
.btn-ghost:hover{border-color:#D1D5DB;color:var(--text);background:var(--surface-2);}
.btn-soft{background:var(--pri-soft);color:var(--pri);}
.btn-soft:hover{background:#E4E2FF;}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px;}
.btn-danger{background:var(--red);color:#fff;}.btn-danger:hover{background:#DC2626;}

/* ============ CARD ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--border-2);}
.card-head h3{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.01em;}
.card-head .sub{font-size:12px;color:var(--text-3);margin-top:1px;font-weight:400;}
.card-body{padding:18px;}
.card-link{font-size:12.5px;font-weight:600;color:var(--pri);cursor:pointer;display:inline-flex;align-items:center;gap:3px;}
.card-link:hover{text-decoration:underline;}

/* ============ KPI ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);}
.kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:#DADCE2;}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.kpi-label{font-size:11.5px;color:var(--text-2);font-weight:500;}
.kpi-ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--pri-tint);color:var(--pri);}
.kpi-ic svg{width:14px;height:14px;}
.kpi-val{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
.kpi-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px;}
.delta{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px;}
.delta.up{color:var(--green);background:var(--green-soft);}
.delta.down{color:var(--red);background:var(--red-soft);}
.delta.flat{color:var(--text-2);background:var(--bg);}
.delta svg{width:11px;height:11px;}
.kpi-note{font-size:11px;color:var(--text-3);}
.spark{display:block;}

/* ============ AI BRIEFING ============ */
.briefing{background:linear-gradient(180deg,var(--pri-tint),#fff 60%);border:1px solid #E4E2FF;border-radius:var(--radius);margin-bottom:20px;overflow:hidden;box-shadow:var(--shadow-sm);}
.briefing-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid #ECEBFF;}
.brief-spark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#635BFF,#8B84FF);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 10px rgba(99,91,255,.35);}
.brief-spark svg{width:19px;height:19px;color:#fff;}
.briefing-head h2{font-size:15.5px;font-weight:700;letter-spacing:-.01em;}
.briefing-head p{font-size:12.5px;color:var(--text-2);margin-top:1px;}
.live-pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--teal);background:var(--teal-soft);padding:4px 10px;border-radius:99px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.insight-list{padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
.insight{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;transition:all .18s;position:relative;}
.insight:hover{box-shadow:var(--shadow-md);border-color:#DADCE2;}
.insight.sev-critical{border-left:3px solid var(--red);}
.insight.sev-high{border-left:3px solid var(--amber);}
.insight.sev-medium{border-left:3px solid var(--pri);}
.insight-top{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap;}
.insight-cat{font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;}
.insight-title{font-size:14.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px;}
.insight-body{font-size:13px;color:var(--text-2);line-height:1.55;}
.ai-expl{background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--radius-sm);padding:10px 12px;margin:10px 0;font-size:12.5px;color:var(--text-2);line-height:1.55;}
.ai-expl .lbl{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.ai-expl .lbl svg{width:12px;height:12px;}
.rec-action{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text);margin:10px 0;}
.rec-action svg{width:15px;height:15px;color:var(--teal);flex-shrink:0;margin-top:1px;}
.insight-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid var(--border-2);}
.meta-chip{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-2);}
.meta-chip b{color:var(--text);font-weight:600;}
.conf{display:flex;align-items:center;gap:6px;}
.conf-bar{width:46px;height:5px;border-radius:3px;background:var(--border);overflow:hidden;}
.conf-fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--teal));border-radius:3px;}
.insight-actions{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;}

/* ============ BADGES ============ */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.5;}
.badge .bdot{width:5px;height:5px;border-radius:50%;}
.badge.green{background:var(--green-soft);color:var(--green);}
.badge.red{background:var(--red-soft);color:var(--red);}
.badge.amber{background:var(--amber-soft);color:#B45309;}
.badge.indigo{background:var(--pri-soft);color:var(--pri);}
.badge.teal{background:var(--teal-soft);color:#0F766E;}
.badge.gray{background:#F3F4F6;color:var(--text-2);}
.sev{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600;}
.sev.critical{background:var(--red-soft);color:var(--red);}
.sev.high{background:var(--amber-soft);color:#B45309;}
.sev.medium{background:var(--pri-soft);color:var(--pri);}
.sev.low{background:#F3F4F6;color:var(--text-2);}

/* ============ TABLE ============ */
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;font-weight:600;color:var(--text-2);padding:10px 16px;border-bottom:1px solid var(--border);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;background:var(--surface-2);}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--border-2);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr{transition:background .12s;}
.tbl tbody tr.clickable{cursor:pointer;}
.tbl tbody tr.clickable:hover{background:var(--pri-tint);}
.cell-main{font-weight:600;color:var(--text);}
.cell-sub{font-size:11.5px;color:var(--text-3);margin-top:1px;}
.u-cell{display:flex;align-items:center;gap:9px;}
.u-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:10.5px;color:#fff;}
.mini-bar{height:6px;border-radius:3px;background:var(--border-2);overflow:hidden;width:100%;max-width:120px;}
.mini-bar span{display:block;height:100%;border-radius:3px;}

/* ============ FEED ============ */
.feed-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border-2);}
.feed-item:last-child{border-bottom:none;}
.feed-ic{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.feed-ic svg{width:15px;height:15px;}
.feed-ic.red{background:var(--red-soft);color:var(--red);}
.feed-ic.indigo{background:var(--pri-soft);color:var(--pri);}
.feed-ic.green{background:var(--green-soft);color:var(--green);}
.feed-ic.amber{background:var(--amber-soft);color:#B45309;}
.feed-ic.teal{background:var(--teal-soft);color:#0F766E;}
.feed-txt{font-size:13px;color:var(--text);line-height:1.4;}
.feed-txt b{font-weight:600;}
.feed-time{font-size:11.5px;color:var(--text-3);margin-top:2px;}

/* ============ CHART ============ */
.legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);font-weight:500;}
.legend-swatch{width:9px;height:9px;border-radius:3px;}
.dist-row{display:flex;align-items:center;gap:12px;margin-bottom:13px;}
.dist-row:last-child{margin-bottom:0;}
.dist-label{width:92px;font-size:12.5px;color:var(--text-2);font-weight:500;flex-shrink:0;display:flex;align-items:center;gap:7px;}
.dist-track{flex:1;height:8px;border-radius:4px;background:var(--border-2);overflow:hidden;}
.dist-fill{height:100%;border-radius:4px;transition:width .5s ease;}
.dist-val{width:62px;text-align:right;font-size:12.5px;font-weight:600;color:var(--text);flex-shrink:0;}

/* ============ GRID HELPERS ============ */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
.row{display:flex;gap:16px;}
.mb-16{margin-bottom:16px;}.mb-20{margin-bottom:20px;}.mt-16{margin-top:16px;}
.section-title{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:4px 0 14px;}

/* ============ DRAWER ============ */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.32);backdrop-filter:blur(1px);z-index:90;opacity:0;visibility:hidden;transition:all .22s;}
.scrim.show{opacity:1;visibility:visible;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:540px;max-width:94vw;background:var(--surface);box-shadow:var(--shadow-lg);z-index:100;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border);}
.drawer-head h3{font-size:16px;font-weight:700;letter-spacing:-.01em;}
.drawer-head .sub{font-size:12.5px;color:var(--text-3);margin-top:2px;}
.x-btn{width:30px;height:30px;border-radius:var(--radius-xs);border:none;background:none;cursor:pointer;color:var(--text-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
.x-btn:hover{background:var(--bg);}
.drawer-body{flex:1;overflow-y:auto;padding:22px;}
.dl-row{margin-bottom:16px;}
.dl-label{font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.dl-val{font-size:13.5px;color:var(--text);line-height:1.5;}

/* ============ COMMAND PALETTE ============ */
.cmdk-scrim{position:fixed;inset:0;background:rgba(17,24,39,.4);backdrop-filter:blur(3px);z-index:200;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;}
.cmdk-scrim.show{display:flex;}
.cmdk{width:600px;max-width:92vw;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);overflow:hidden;animation:cmdkIn .18s ease;}
@keyframes cmdkIn{from{opacity:0;transform:translateY(-8px) scale(.98);}to{opacity:1;transform:none;}}
.cmdk-input-wrap{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--border);}
.cmdk-input-wrap svg{width:18px;height:18px;color:var(--text-3);}
.cmdk-input{flex:1;border:none;outline:none;font-family:inherit;font-size:15px;color:var(--text);background:none;}
.cmdk-results{max-height:min(380px,54vh);overflow-y:auto;padding:8px;}
.cmdk-group-label{font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px 4px;}
.cmdk-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:13.5px;}
.cmdk-item.sel,.cmdk-item:hover{background:var(--pri-tint);}
.cmdk-item svg{width:16px;height:16px;color:var(--text-2);}
.cmdk-item .ci-sub{font-size:11.5px;color:var(--text-3);margin-left:auto;}
.cmdk-empty{padding:28px;text-align:center;color:var(--text-3);font-size:13px;}

/* ============ TOAST ============ */
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:10px;}
.toast{display:flex;align-items:center;gap:11px;background:var(--side);color:#fff;padding:12px 16px;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;min-width:260px;animation:toastIn .25s ease;}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}
.toast svg{width:17px;height:17px;flex-shrink:0;}
.toast .t-ic.green{color:#4ADE80;}.toast .t-ic.indigo{color:#A5A0FF;}.toast .t-ic.amber{color:#FCD34D;}

/* ============ MODAL ============ */
.modal-scrim{position:fixed;inset:0;background:rgba(17,24,39,.4);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center;padding:24px;}
.modal-scrim.show{display:flex;}
.modal{width:480px;max-width:94vw;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);animation:cmdkIn .18s ease;max-height:86vh;overflow-y:auto;}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{font-size:15px;font-weight:700;}
.modal-body{padding:20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px;}
.input,select.input,textarea.input{width:100%;height:36px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:all .15s;}
textarea.input{height:auto;padding:9px 11px;resize:vertical;min-height:76px;line-height:1.5;}
.input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-ring);}

/* ============ TABS ============ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px;}
.tab{padding:9px 15px;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .14s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--pri);border-bottom-color:var(--pri);font-weight:600;}

/* ============ TOGGLE ============ */
.switch{width:38px;height:22px;border-radius:99px;background:var(--border);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.switch.on{background:var(--pri);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:var(--shadow-sm);}
.switch.on::after{transform:translateX(16px);}

/* ============ MISC ============ */
.empty-state{text-align:center;padding:52px 20px;color:var(--text-3);}
.empty-state svg{width:34px;height:34px;margin-bottom:10px;opacity:.5;}
.stub{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 24px;text-align:center;}
.stub .stub-ic{width:52px;height:52px;border-radius:14px;background:var(--pri-tint);color:var(--pri);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.stub .stub-ic svg{width:26px;height:26px;}
.stub h3{font-size:17px;font-weight:700;margin-bottom:6px;}
.stub p{font-size:13.5px;color:var(--text-2);max-width:380px;}
.text-2{color:var(--text-2);}.text-3{color:var(--text-3);}.fw6{font-weight:600;}
.flex{display:flex;}.items-center{align-items:center;}.gap-8{gap:8px;}.gap-12{gap:12px;}.justify-between{justify-content:space-between;}
.kpi-8{grid-template-columns:repeat(4,1fr);}
@media(max-width:1200px){.kpi-grid,.kpi-8{grid-template-columns:repeat(3,1fr);}}

.nav-group-title{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:color .15s;}
.nav-group-title:hover{color:rgba(255,255,255,.6);}
.nav-group-title .ng-chev{opacity:.45;transition:transform .18s;}

 .nav-mini{display:none;flex-direction:column;align-items:center;gap:5px;padding:6px 0;}

.ask-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;}

.ask-ev-item{font-size:12px;color:var(--text-2);padding:2px 0;}

// ---------- NAV ----------
const NAV=[

const MOD_TITLE={overview:'Revenue Command Centre',customers:'Customers',subscriptions:'Subscriptions',products:'Products & Pricing',invoices:'Invoices & Billing',payments:'Payments',collections:'Collections',refunds:'Credit Notes & Refunds',insights:'AI Revenue Insights',analytics:'Revenue Analytics',reconciliation:'Reconciliation',leakage:'Revenue Leakage Monitor',workflows:'Workflows & Automations',approvals:'Tasks & Approvals',teamaccess:'Team & Access',integrations:'Integrations',settings:'Settings',search:'Search Results'};
const MOD_GROUP={};NAV.forEach(g=>g.items.forEach(i=>MOD_GROUP[i.id]=g.group));

// ---------- SEEDED DATA GENERATION ----------
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=rng(1337);
function pick(a){return a[Math.floor(R()*a.length)];}
function ri(lo,hi){return lo+Math.floor(R()*(hi-lo+1));}
function pad(n,w){return String(n).padStart(w,'0');}

const PLAN_BY_ID=Object.fromEntries(PLANS.map(p=>[p.id,p]));
const C_PRE=['Nimbus','Vertex','Quanta','Apex','Lumen','Northwind','Cobalt','Solstice','Pioneer','Meridian','Catalyst','Orbit','Harbor','Beacon','Summit','Axion','Everest','Cedar','Dynamo','Fathom','Granite','Helios','Ironclad','Juniper','Kestrel','Lattice','Monarch','Novex','Onyx','Paragon','Quartz','Radiant','Sterling','Tandem','Umbra','Vantage','Westgate','Zenith','Aurora','Brightline'];

const FN=['Aarav','Priya','Rohan','Sara','Vikram','Neha','Arjun','Divya','Karan','Meera','Rahul','Ananya','Imran','Fatima','Dev','Isha','Nikhil','Pooja','Sanjay','Tara'];

const GATEWAYS=['Stripe','Adyen','Razorpay','PayPal'];
const METHODS=['Visa ••4242','Mastercard ••5518','Amex ••1007','ACH transfer','Visa ••9910'];
const today=new Date('2026-11-12');
function dshift(days){const d=new Date(today);d.setDate(d.getDate()+days);return d.toISOString().slice(0,10);}

const DATA={plans:PLANS,customers:[],subs:[],invoices:[],payments:[],refunds:[],recon:[],anomalies:[],tasks:[]};
(function generate(){
  let subN=420,invN=124,payN=560,refN=10,recN=880,taskN=1;
  for(let i=0;i<50;i++){
    const company=C_PRE[i%C_PRE.length]+' '+pick(C_SUF);
    const contact=pick(FN)+' '+pick(LN);
    const r=R();const status=r<0.66?'Active':r<0.76?'Trial':r<0.9?'Past Due':'Churned';

function recById(id){return subById(id)||invById(id)||payById(id)||DATA.tasks.find(t=>t.id===id)||DATA.anomalies.find(a=>a.id===id)||DATA.recon.find(r=>r.id===id)||DATA.refunds.find(r=>r.id===id)||custById(id);}
function ovSet(id,patch){const o=sget('overrides',{});o[id]={...(o[id]||{}),...patch};sset('overrides',o);const r=recById(id);if(r)Object.assign(r,patch);}
function applyOverrides(){
  sget('extraInvoices',[]).forEach(i=>{if(!DATA.invoices.find(x=>x.id===i.id)){DATA.invoices.unshift(i);const c=custById(i.customer);if(c&&!c.invoices.includes(i.id))c.invoices.unshift(i.id);}});
  sget('extraPayments',[]).forEach(p=>{if(!DATA.payments.find(x=>x.id===p.id)){DATA.payments.unshift(p);const c=custById(p.customer);if(c&&!c.payments.includes(p.id))c.payments.unshift(p.id);}});
  sget('extraTasks',[]).forEach(t=>{if(!DATA.tasks.find(x=>x.id===t.id))DATA.tasks.unshift(t);});
  sget('extraRefunds',[]).forEach(r=>{if(!DATA.refunds.find(x=>x.id===r.id))DATA.refunds.unshift(r);});
  const o=sget('overrides',{});Object.keys(o).forEach(id=>{const r=recById(id);if(r)Object.assign(r,o[id]);});
}
function addPayment(custId,invId,amount,method,gateway){const id='PAY-'+pad(900000+get_counter('pay'),6);const fee=Math.round(amount*0.025);const p={id,customer:custId,invoice:invId,amount,method:method||'Visa ••4242',gateway:gateway||'Stripe',fee,net:amount-fee,date:dshift(0),status:'Successful',reason:''};DATA.payments.unshift(p);const ex=sget('extraPayments',[]);ex.unshift(p);sset('extraPayments',ex);const c=custById(custId);if(c)c.payments.unshift(id);audit(`Payment ${id} recorded · ${money(amount)}`);return id;}
function addInvoice(ni){DATA.invoices.unshift(ni);const ex=sget('extraInvoices',[]);ex.unshift(ni);sset('extraInvoices',ex);const c=custById(ni.customer);if(c)c.invoices.unshift(ni.id);audit(`Invoice ${ni.id} created`);}
function get_counter(k){const v=sget('counter_'+k,0);sset('counter_'+k,v+1);return v;}
function addTask(cat,custId,impact,title){const id='TASK-'+pad(200+get_counter('task'),3);const t={id,title:title||cat,category:cat,customer:custId,impact,assignee:'Unassigned',priority:'Medium',due:dshift(5),status:'Open'};DATA.tasks.unshift(t);const ex=sget('extraTasks',[]);ex.unshift(t);sset('extraTasks',ex);audit(`Task ${id} created · ${cat}`);return id;}
function addRefund(custId,payId,invId,amount,type,reason){const id='REF-'+pad(200+get_counter('ref'),4);const r={id,customer:custId,payment:payId,invoice:invId,type,amount,reason,status:'Pending',created:dshift(0)};DATA.refunds.unshift(r);const ex=sget('extraRefunds',[]);ex.unshift(r);sset('extraRefunds',ex);audit(`Refund ${id} requested · ${money(amount)}`);return id;}

function searchAll(q){
  q=q.toLowerCase().trim();const out=[];
  const mods=Object.keys(MOD_TITLE).filter(m=>MOD_TITLE[m].toLowerCase().includes(q)).slice(0,4).map(m=>({type:'mod',id:m,label:MOD_TITLE[m],sub:'Module',icon:(NAV.flatMap(g=>g.items).find(i=>i.id===m)||{}).icon||'overview'}));
  if(mods.length)out.push({label:'Modules',items:mods});
  if(!q)return out;
  const cu=DATA.customers.filter(c=>(c.id+' '+c.name+' '+c.email+' '+c.status+' '+c.risk).toLowerCase().includes(q)).slice(0,6).map(c=>({type:'customer',id:c.id,label:c.name,sub:c.id,amount:money(c.mrr)+' MRR',status:c.status,icon:'customers'}));
  if(cu.length)out.push({label:'Customers',items:cu});
  const su=DATA.subs.filter(s=>(s.id+' '+custById(s.customer).name+' '+planName(s.plan)+' '+s.status).toLowerCase().includes(q)).slice(0,6).map(s=>({type:'sub',id:s.id,label:planName(s.plan)+' · '+custById(s.customer).name,sub:s.id,amount:money(s.mrr)+' MRR',status:s.status,icon:'subs'}));
  if(su.length)out.push({label:'Subscriptions',items:su});
  const iv=DATA.invoices.filter(i=>(i.id+' '+custById(i.customer).name+' '+i.status).toLowerCase().includes(q)).slice(0,6).map(i=>({type:'invoice',id:i.id,label:i.id+' · '+custById(i.customer).name,sub:'Due '+i.due,amount:money(i.total),status:i.status,icon:'invoices'}));
  if(iv.length)out.push({label:'Invoices',items:iv});
  const pa=DATA.payments.filter(p=>(p.id+' '+custById(p.customer).name+' '+p.status).toLowerCase().includes(q)).slice(0,6).map(p=>({type:'payment',id:p.id,label:p.id+' · '+custById(p.customer).name,sub:p.gateway,amount:money(p.amount),status:p.status,icon:'payments'}));
  if(pa.length)out.push({label:'Payments',items:pa});
  const an=DATA.anomalies.filter(a=>(a.id+' '+a.category+' '+custById(a.customer).name+' '+a.severity+' '+a.status).toLowerCase().includes(q)).slice(0,5).map(a=>({type:'anomaly',id:a.id,label:a.category+' · '+custById(a.customer).name,sub:a.id,amount:money(a.impact),status:a.severity,icon:'leakage'}));
  if(an.length)out.push({label:'Revenue anomalies',items:an});
  const ins=DATA.insights.filter(i=>(i.title+' '+i.cat).toLowerCase().includes(q)).slice(0,3).map(i=>({type:'insight',id:i.id,label:i.title,sub:i.cat,amount:money(i.impact),icon:'sparkle'}));
  if(ins.length)out.push({label:'AI insights',items:ins});
  return out;
}
let cmdkSel=0,cmdkItems=[];
function openCmdk(){document.getElementById('cmdkScrim').classList.add('show');const i=document.getElementById('cmdkInput');i.value='';renderCmdk();setTimeout(()=>i.focus(),30);}
function closeCmdk(){document.getElementById('cmdkScrim').classList.remove('show');}
function renderCmdk(){const q=document.getElementById('cmdkInput').value;const groups=searchAll(q);cmdkItems=groups.flatMap(g=>g.items);cmdkSel=0;let h='';
  if(!q){h+=`<div class="cmdk-group-label">Suggested searches</div>`+[['Overdue invoices','overdue'],['Failed payments','failed'],['Past due accounts','past due'],['Open revenue anomalies','open']].map((s)=>`<div class="cmdk-item" onclick="sset('search_q','${s[1]}');sset('search_entity','all');navigate('search');closeCmdk();"><span style="color:var(--text-3)">${svgIcon('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',15)}</span><span>${s[0]}</span></div>`).join('');}
  if(!cmdkItems.length&&q){h=`<div class="cmdk-empty">No matches for "${q}"</div>`;}
  else if(cmdkItems.length){let idx=0;groups.forEach(g=>{h+=`<div class="cmdk-group-label">${g.label}</div>`;g.items.forEach(it=>{const i=idx++;h+=`<div class="cmdk-item ${i===0?'sel':''}" data-i="${i}" onmouseover="cmdkHover(${i})" onclick="cmdkGo(${i})">${svgIcon(IC[it.icon]||IC.overview,16)}<span>${it.label}</span>${it.status?`<span style="margin-left:auto">${typeof it.status==='string'&&['Critical','High','Medium','Low'].includes(it.status)?sevBadge(it.status):statusBadge(it.status)}</span>`:''}${it.amount?`<span class="ci-sub" style="${it.status?'margin-left:8px':'margin-left:auto'}">${it.amount}</span>`:(it.sub&&!it.status?`<span class="ci-sub">${it.sub}</span>`:'')}</div>`;});});}
  document.getElementById('cmdkResults').innerHTML=h;
}
function cmdkHover(i){cmdkSel=i;document.querySelectorAll('.cmdk-item[data-i]').forEach(el=>el.classList.toggle('sel',+el.dataset.i===i));}
function cmdkKey(e){if(e.key==='ArrowDown'){e.preventDefault();cmdkSel=Math.min(cmdkSel+1,cmdkItems.length-1);}else if(e.key==='ArrowUp'){e.preventDefault();cmdkSel=Math.max(cmdkSel-1,0);}else if(e.key==='Enter'){e.preventDefault();if(cmdkItems.length)cmdkGo(cmdkSel);return;}else if(e.key==='Escape'){closeCmdk();return;}document.querySelectorAll('.cmdk-item[data-i]').forEach(el=>el.classList.toggle('sel',+el.dataset.i===cmdkSel));const s=document.querySelector('.cmdk-item.sel');if(s)s.scrollIntoView({block:'nearest'});}
function cmdkGo(i){const it=cmdkItems[i];if(!it)return;closeCmdk();routeEntity(it.type,it.id);}
function routeEntity(type,id){
  if(type==='mod')return navigate(id);
  if(type==='customer')return (window.openCustomer||(()=>navigate('customers')))(id);
  if(type==='sub')return (window.openSub||(()=>navigate('subscriptions')))(id);
  if(type==='invoice')return (window.openInvoice||(()=>navigate('invoices')))(id);
  if(type==='payment')return (window.openPayment||(()=>navigate('payments')))(id);
  if(type==='anomaly')return (window.openAnomaly||(()=>navigate('leakage')))(id);
  if(type==='insight')return (window.showInsightDetail||(()=>navigate('insights')))(id);
}
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmdk();}if(e.key==='Escape'){closeCmdk();closeModal();closeDrawer();}});

function applyDiscountModal(id){const s=subById(id);openModal(`<div class="modal-head"><h3>Apply discount · ${s.id}</h3>${XBTN}</div><div class="modal-body"><div class="field"><label>Discount %</label><select class="input" id="discPct"><option>10</option><option>15</option><option>20</option><option>25</option></select></div><div class="field"><label>Duration</label><select class="input"><option>3 months</option><option>6 months</option><option>Lifetime of subscription</option></select></div><div class="ai-expl" style="margin-top:4px"><span class="lbl">${svgIcon(IC.sparkle,12)} Policy</span><br>Discounts above 20% exceed standard policy and are logged for review.</div></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-pri" onclick="doApplyDiscount('${id}')">Apply discount</button></div>`);}

function sendInvoice(id){const i=invById(id);const c=custById(i.customer);confirmModal('Send invoice',`Email invoice ${id} (${money(i.total)}) to <b>${c.email}</b> with a payment link.`,'Send invoice',false,()=>{audit(`Invoice ${id} sent to ${c.email}`);closeModal();toast('Invoice sent to '+c.email,'green');});}
function recordPaymentModal(id){const i=invById(id);openModal(`<div class="modal-head"><h3>Record payment · ${id}</h3>${XBTN}</div><div class="modal-body"><div class="flex justify-between" style="font-size:12.5px;padding:4px 0"><span class="text-2">Outstanding</span><b>${money(i.outstanding)}</b></div><div class="field" style="margin-top:10px"><label>Amount received (USD)</label><input class="input" id="rpAmt" value="${i.outstanding}"></div><div class="field"><label>Method</label><select class="input" id="rpMethod"><option>Visa ••4242</option><option>ACH transfer</option><option>Mastercard ••5518</option><option>Wire</option></select></div></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-pri" onclick="doRecordPayment('${id}')">Record payment</button></div>`);}
function doRecordPayment(id){const i=invById(id);const amt=Math.min(+document.getElementById('rpAmt').value||0,i.outstanding);const method=document.getElementById('rpMethod').value;if(amt<=0){toast('Enter an amount','amber');return;}addPayment(i.customer,id,amt,method);const paid=i.paid+amt;const out=Math.max(0,i.total-paid);ovSet(id,{paid,outstanding:out,status:out<=0?'Paid':'Partially Paid'});closeModal();openInvoice(id);toast('Payment of '+money(amt)+' recorded','green');}

function retryPayment(id){const p=payById(id);confirmModal('Retry payment',`Re-attempt <b>${money(p.amount)}</b> on ${p.method}. If it fails again, Revora runs the dunning schedule and notifies the owner.`,'Retry now',false,()=>{ovSet(id,{status:'Successful',reason:''});const inv=invById(p.invoice);if(inv)ovSet(inv.id,{paid:inv.total,outstanding:0,status:'Paid'});audit(`Payment ${id} retried successfully · ${money(p.amount)} recovered`);openPayment(id);toast('Payment recovered · invoice settled','green');});}
function flagPayment(id){const p=payById(id);ovSet(id,{flagged:!p.flagged});audit(`Payment ${id} ${p.flagged?'unflagged':'flagged for review'}`);openPayment(id);toast(p.flagged?'Flag removed':'Transaction flagged for review',p.flagged?'indigo':'amber');}
function refundModal(id){const p=payById(id);openModal(`<div class="modal-head"><h3>Issue refund · ${id}</h3>${XBTN}</div><div class="modal-body"><div class="flex justify-between" style="font-size:12.5px;padding:4px 0"><span class="text-2">Original payment</span><b>${money(p.amount)}</b></div><div class="field" style="margin-top:10px"><label>Refund type</label><select class="input" id="rfType" onchange="document.getElementById('rfAmt').value=this.value==='Full refund'?${p.amount}:${Math.round(p.amount/2)}"><option>Full refund</option><option>Partial refund</option></select></div><div class="field"><label>Amount (USD)</label><input class="input" id="rfAmt" value="${p.amount}"></div><div class="field"><label>Reason</label><select class="input" id="rfReason"><option>Customer request</option><option>Billing error</option><option>Duplicate charge</option><option>Service credit</option></select></div><div class="ai-expl" style="margin-top:4px"><span class="lbl">${svgIcon(IC.sparkle,12)} Policy</span><br>Refunds route to approval before funds move. This creates a pending refund in Credit Notes & Refunds.</div></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-pri" onclick="doRefund('${id}')">Submit refund</button></div>`);}
function doRefund(id){const p=payById(id);const type=document.getElementById('rfType').value;const amt=Math.min(+document.getElementById('rfAmt').value||0,p.amount);const reason=document.getElementById('rfReason').value;const rid=addRefund(p.customer,id,p.invoice,amt,type,reason);closeModal();toast('Refund '+rid+' submitted for approval','green');openPayment(id);}

renders.collections=function(){
  const overdue=DATA.invoices.filter(i=>i.status==='Overdue'||(i.outstanding>0&&i.due<today.toISOString().slice(0,10)));
  const outstanding=DATA.invoices.filter(i=>i.outstanding>0);
  const totalOut=outstanding.reduce((s,i)=>s+i.outstanding,0);
  const overdueAmt=overdue.reduce((s,i)=>s+i.outstanding,0);
  // ageing buckets
  const buckets=[['Current',0,0],['1–30 days',0,0],['31–60 days',0,0],['61–90 days',0,0],['90+ days',0,0]];
  const tdy=new Date(today);
  outstanding.forEach(i=>{const d=Math.floor((tdy-new Date(i.due))/864e5);let b=d<=0?0:d<=30?1:d<=60?2:d<=90?3:4;buckets[b][1]+=i.outstanding;buckets[b][2]++;});
  const bcol=['#14B8A6','#635BFF','#F59E0B','#F97316','#DC4444'];
  let h=`<div class="content-inner"><div class="page-head"><div><div class="page-title">Collections</div><div class="page-sub">Recover outstanding revenue — ${money(totalOut)} across ${outstanding.length} invoices</div></div></div>`;
  h+=`<div class="kpi-grid" style="grid-template-columns:repeat(5,1fr)">${[['Total outstanding',money(totalOut),'warn'],['Overdue',money(overdueAmt),'bad'],['Due this week',money(Math.round(totalOut*0.22)),''],['Failed payments',DATA.payments.filter(p=>p.status==='Failed').length,'bad'],['Recovery rate','73%','good']].map(k=>`<div class="kpi" style="cursor:default"><div class="kpi-label">${k[0]}</div><div class="kpi-val" style="font-size:20px;margin-top:6px;${k[2]==='good'?'color:var(--green)':k[2]==='warn'?'color:var(--amber)':k[2]==='bad'?'color:var(--red)':''}">${k[1]}</div></div>`).join('')}</div>`;
  // ageing
  h+=`<div class="grid-2-1 mb-20"><div class="card"><div class="card-head"><h3>Ageing report</h3><div class="sub">Outstanding by days overdue</div></div><div class="card-body">${buckets.map((b,idx)=>`<div class="dist-row"><div class="dist-label" style="width:92px">${b[0]}</div><div class="dist-track"><div class="dist-fill" style="width:${totalOut?Math.max(2,b[1]/totalOut*100):0}%;background:${bcol[idx]}"></div></div><div class="dist-val">${money(b[1])}</div><div class="text-3" style="width:48px;text-align:right;font-size:11.5px">${b[2]} inv</div></div>`).join('')}</div></div>
    <div class="card"><div class="card-head"><h3 style="font-size:13px">Dunning workflow</h3></div><div class="card-body" style="padding-top:8px">${['Payment failure','Immediate notification','Retry after 24h','Second notification','Retry after 3 days','Final reminder','Grace period expiry','Suspension'].map((st,idx)=>`<div style="display:flex;gap:10px;align-items:flex-start;padding:6px 0"><div style="width:20px;height:20px;border-radius:50%;background:${idx<3?'var(--green-soft)':idx<5?'var(--amber-soft)':'var(--bg)'};color:${idx<3?'var(--green)':idx<5?'#B45309':'var(--text-3)'};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">${idx+1}</div><div style="font-size:12.5px;padding-top:1px">${st}${idx<3?' <span class="text-3">· done</span>':idx===3?' <span style="color:var(--amber)">· active</span>':''}</div></div>`).join('')}</div></div></div>`;
  // queue
  h+=`<div class="card"><div class="card-head"><div><h3>Collections queue</h3><div class="sub">Prioritised by value and days overdue</div></div><button class="btn btn-soft btn-sm" onclick="launchDunning()">Launch dunning</button></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Customer</th><th>Invoice</th><th>Outstanding</th><th>Days overdue</th><th>Reminders</th><th>Owner</th><th>Risk</th></tr></thead><tbody>`;
  overdue.map(i=>({i,d:Math.floor((tdy-new Date(i.due))/864e5)})).sort((a,b)=>b.i.outstanding-a.i.outstanding).slice(0,12).forEach(({i,d})=>{const c=custById(i.customer);h+=`<tr class="clickable" onclick="openInvoice('${i.id}')"><td><div class="u-cell">${avatar(c.name,24)}<span style="font-size:12.5px">${c.name}</span></div></td><td class="cell-main" style="font-size:12.5px">${i.id}</td><td class="fw6">${money(i.outstanding)}</td><td><span class="badge ${d>60?'red':d>30?'amber':'gray'}">${d>0?d+' days':'Due soon'}</span></td><td>${ri(0,3)}</td><td class="text-2" style="font-size:12px">${pick(FN)} ${pick(LN)[0]}.</td><td>${riskBadge(c.risk)}</td></tr>`;});
  h+=`</tbody></table></div></div></div>`;
  document.getElementById('content').innerHTML=h;
};

const RASK=['Why did MRR change this month?','How much are we losing to failed payments?','Which customers have overdue invoices above $5,000?','Which subscriptions are incorrectly priced?','What are the largest leakage opportunities?','Which customers are at highest churn risk?'];
function revoraAnswer(q){q=q.toLowerCase();
  if(q.includes('mrr'))return{a:`MRR grew <b>8.4%</b> to <b>$842,500</b> this month. New (${money(42000)}) and expansion (${money(28000)}) outweighed contraction (-$9,500) and churn (-$15,200), for <b>net new MRR of ${money(45300)}</b>.`,ev:['New MRR $42,000','Expansion $28,000','Churn -$15,200'],act:'Protect expansion by fixing the 32 underbilled subscriptions.',recs:[]};
  if(q.includes('failed')||q.includes('losing'))return{a:`<b>${money(32400)}</b> in transactions failed in the last 24h — a 26% jump. Most are expired cards and insufficient funds on monthly plans.`,ev:['4.2% failure rate',DATA.payments.filter(p=>p.status==='Failed').length+' failed payments'],act:'Launch the Failed Payment Recovery workflow.',recs:DATA.payments.filter(p=>p.status==='Failed').slice(0,3).map(p=>({id:p.id,t:'pay'}))};
  if(q.includes('overdue'))return{a:`There are overdue invoices above $5,000 concentrated in a few mid-market accounts. The largest overdue balances are in the 31–60 day bucket.`,ev:['$124,600 outstanding','31–60 day bucket growing'],act:'Prioritise the collections queue by value.',recs:DATA.invoices.filter(i=>i.status==='Overdue'&&i.outstanding>5000).slice(0,3).map(i=>({id:i.id,t:'inv'}))};
  if(q.includes('priced')||q.includes('underbill'))return{a:`<b>32 active subscriptions</b> are billed below their current contract price — ${money(14850)} in monthly leakage. 18 have outdated pricing, 9 wrong seat counts, 5 unapplied add-ons.`,ev:['$14,850/mo leakage','32 subscriptions'],act:'Review affected subscriptions and generate corrective invoices.',recs:[]};
  if(q.includes('leakage')||q.includes('largest'))return{a:`The biggest leakage sources are <b>underbilling</b> (${money(14850)}/mo) and <b>uncollected overdue invoices</b>. Total identified leakage this month is ${money(18750)} across 14 issues.`,ev:['Underbilling $14,850','14 open anomalies'],act:'Work the leakage register top-down by impact.',recs:[]};
  if(q.includes('churn')||q.includes('risk'))return{a:`<b>47 subscriptions worth ${money(86200)} ARR</b> are at elevated churn risk — upcoming renewals with unresolved payment issues.`,ev:['47 at-risk renewals','$86,200 ARR'],act:'Prioritise renewal outreach and payment-method updates.',recs:[]};

function mrrWaterfall(){
  const open=797000;const steps=[['Opening',open,'#9AA1B1',false],['New',42000,'#16A34A',true],['Expansion',28000,'#14B8A6',true],['Contraction',-9500,'#F59E0B',true],['Churned',-15200,'#DC4444',true],['Closing',842500,'#635BFF',false]];
  const maxV=870000;let cum=0;let h='<div style="display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px">';
  steps.forEach((s,idx)=>{let base,height,val=s[1];
    if(!s[3]){base=0;height=val/maxV*160;cum=val;}
    else{if(val>=0){base=cum/maxV*160;height=val/maxV*160;cum+=val;}else{cum+=val;base=cum/maxV*160;height=-val/maxV*160;}}
    h+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%"><div style="font-size:10.5px;font-weight:600;margin-bottom:4px;color:${val<0?'var(--red)':'var(--text-2)'}">${moneyK(val)}</div><div style="width:100%;position:relative;height:160px;display:flex;align-items:flex-end"><div style="width:100%;height:${Math.abs(height)}px;background:${s[2]};border-radius:4px 4px 0 0;margin-bottom:${base}px;${s[2]==='#9AA1B1'||s[2]==='#635BFF'?'':'opacity:.9'}"></div></div><div class="text-3" style="font-size:10.5px;margin-top:6px">${s[0]}</div></div>`;});
  h+='</div>';return h;
}

renders.integrations=function(){
  const cats={Payments:[['Stripe','1'],['PayPal','0'],['Adyen','1'],['Razorpay','1']],Accounting:[['QuickBooks','1'],['Xero','0'],['NetSuite','0'],['Zoho Books','0']],CRM:[['Salesforce','1'],['HubSpot','0']],Communication:[['Gmail','1'],['Outlook','0'],['Slack','1'],['Microsoft Teams','0']],Data:[['Snowflake','1'],['BigQuery','0'],['Google Sheets','1']]};
  let h=`<div class="content-inner"><div class="page-head"><div><div class="page-title">Integrations</div><div class="page-sub">Connect Revora to your payment, accounting and data stack — Revora reads from these; it never replaces your system of record.</div></div></div>`;
  Object.entries(cats).forEach(([cat,items])=>{h+=`<div class="section-title">${cat}</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px">${items.map(ig=>{const on=sget('rint_'+ig[0],ig[1]==='1');return `<div class="card"><div class="card-body flex items-center gap-12"><div style="width:34px;height:34px;border-radius:8px;background:var(--pri-tint);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">${ig[0][0]}</div><div style="flex:1"><div class="cell-main" style="font-size:13px">${ig[0]}</div><div class="cell-sub">${cat}${on?' · synced 2h ago':''}</div></div>${on?`<div class="flex gap-8"><span class="badge green">Connected</span><button class="ctrl" onclick="configureModal('${ig[0]}')">Configure</button></div>`:`<button class="btn btn-ghost btn-sm" onclick="sset('rint_${ig[0]}',true);renders.integrations();toast('${ig[0]} connected','green')">Connect</button>`}</div></div>`;}).join('')}</div>`;});
  h+=`</div>`;
  document.getElementById('content').innerHTML=h;
};

// SETTINGS
// ============================================================
const SNAV=[['general','General'],['billing','Billing configuration'],['payment','Payment settings'],['ai','AI configuration'],['team','Team & permissions'],['security','Security'],['notifications','Notifications']];
renders.settings=function(sub){
  const tab=sub||sget('set_tab','general');sset('set_tab',tab);
  let h=`<div class="content-inner"><div class="page-head"><div><div class="page-title">Settings</div><div class="page-sub">Configure Revora AI for Acme Cloud</div></div></div><div style="display:grid;grid-template-columns:220px 1fr;gap:22px;align-items:start"><div class="card" style="padding:8px"><div style="display:flex;flex-direction:column;gap:1px">${SNAV.map(n=>`<div class="cmdk-item ${n[0]===tab?'sel':''}" style="font-size:13px;${n[0]===tab?'font-weight:600;color:var(--pri)':''}" onclick="renders.settings('${n[0]}')"><span>${n[1]}</span></div>`).join('')}</div></div><div>${settingsPanel(tab)}</div></div></div>`;
  document.getElementById('content').innerHTML=h;
};
function toggleRow(label,sub,key,def){const on=sget(key,def);return `<div class="flex items-center justify-between" style="padding:11px 0;border-bottom:1px solid var(--border-2)"><div><div class="cell-main" style="font-size:12.5px">${label}</div>${sub?`<div class="cell-sub">${sub}</div>`:''}</div><div class="switch ${on?'on':''}" onclick="sset('${key}',${!on});renders.settings(sget('set_tab','general'))"></div></div>`;}
function settingsPanel(tab){
  if(tab==='general')return `<div class="card"><div class="card-head"><h3>Organisation</h3></div><div class="card-body"><div class="grid-2">${[['Organisation name','Acme Cloud'],['Default currency','USD ($)'],['Time zone','America/New_York (GMT-5)'],['Date format','MMM DD, YYYY'],['Fiscal year start','January'],['Company registration','Acme Cloud Inc.']].map(f=>`<div class="field"><label>${f[0]}</label><input class="input" value="${f[1]}"></div>`).join('')}</div><button class="btn btn-pri btn-sm" onclick="toast('Saved','green')">Save changes</button></div></div>`;
  if(tab==='billing')return `<div class="card" style="margin-bottom:16px"><div class="card-head"><h3>Billing configuration</h3></div><div class="card-body"><div class="grid-2">${[['Default billing cycle','Monthly'],['Invoice numbering','INV-YYYY-#####'],['Payment terms','Net 15'],['Grace period','5 days']].map(f=>`<div class="field"><label>${f[0]}</label><input class="input" value="${f[1]}"></div>`).join('')}</div>${toggleRow('Automatic invoice generation','Generate invoices on each billing date','bill_auto',true)}${toggleRow('Proration on plan changes','Prorate upgrades and downgrades','bill_prorate',true)}${toggleRow('Invoice reminders','Send reminders before and after due date','bill_remind',true)}</div></div>`;
  if(tab==='payment')return `<div class="card"><div class="card-head"><h3>Payment settings</h3></div><div class="card-body"><div class="field"><label>Default gateway</label><select class="input" style="max-width:280px"><option>Stripe</option><option>Adyen</option><option>Razorpay</option></select></div><div class="field"><label>Supported currencies</label><input class="input" value="USD, EUR, GBP, INR"></div>${toggleRow('Smart retry on failed payments','Retry with dunning schedule','pay_retry',true)}${toggleRow('Allow ACH / bank transfer','','pay_ach',true)}${toggleRow('Require CVC on card updates','','pay_cvc',true)}</div></div>`;
  if(tab==='ai'){const auto=sget('ai_autonomy','approval');return `<div class="card" style="margin-bottom:16px"><div class="card-head"><div class="flex items-center gap-8"><span style="color:var(--pri)">${svgIcon(IC.sparkle,15)}</span><h3>AI configuration</h3></div></div><div class="card-body">${toggleRow('Enable Revora AI','Powers insights, leakage detection and the assistant','ai_enabled',true)}<div class="grid-2" style="margin-top:14px"><div class="field"><label>Model</label><select class="input"><option>Revora-Pro (balanced)</option><option>Revora-Max</option></select></div><div class="field"><label>Anomaly threshold</label><select class="input"><option>Medium (recommended)</option><option>High sensitivity</option><option>Low</option></select></div></div></div></div>
    <div class="card" style="margin-bottom:16px"><div class="card-head"><h3>AI autonomy</h3><div class="sub">How much Revora can act on its own</div></div><div class="card-body">${[['suggest','Suggest only','Revora recommends; humans take every action'],['approval','Require human approval','Revora prepares actions; a human approves before execution'],['auto','Auto-execute approved workflows','Revora runs pre-approved workflows without prompting']].map(o=>`<div onclick="sset('ai_autonomy','${o[0]}');renders.settings('ai')" style="display:flex;gap:11px;align-items:flex-start;padding:11px;border:1px solid ${auto===o[0]?'var(--pri)':'var(--border)'};border-radius:var(--radius-sm);margin-bottom:9px;cursor:pointer;background:${auto===o[0]?'var(--pri-tint)':'#fff'}"><div style="width:18px;height:18px;border-radius:50%;border:2px solid ${auto===o[0]?'var(--pri)':'var(--border)'};flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center">${auto===o[0]?'<div style="width:8px;height:8px;border-radius:50%;background:var(--pri)"></div>':''}</div><div><div class="cell-main" style="font-size:13px">${o[1]}</div><div class="cell-sub">${o[2]}</div></div></div>`).join('')}<div class="rec-action" style="margin-top:6px">${svgIcon(IC.alert,15)}<span class="text-2" style="font-size:12px">High-impact actions (refunds, price changes, invoice edits, cancellations) always require approval regardless of this setting.</span></div></div></div>
    <div class="card" style="margin-bottom:16px"><div class="card-head"><h3>Approval limits</h3><div class="sub">Money-moving actions above these require a second approver</div></div><div class="card-body"><div class="grid-2"><div class="field"><label>Refund auto-approve under</label><input class="input" value="$500"></div><div class="field"><label>Billing adjustment under</label><input class="input" value="$1,000"></div><div class="field"><label>Price override approver</label><select class="input"><option>Finance Admin</option><option>Super Admin</option></select></div><div class="field"><label>Cancellation approver</label><select class="input"><option>Rev Ops Manager</option><option>Finance Admin</option></select></div></div>${toggleRow('Immutable audit log','Every approval and money-moving action is recorded','set_audit',true)}<button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="auditDrawer()">View audit log</button></div></div>
    <div class="card"><div class="card-head"><h3>Insight monitoring</h3></div><div class="card-body">${RIN_CATS.slice(1).map(c=>toggleRow(c,'','rmon_'+c,true)).join('')}</div></div>`;}
  if(tab==='team')return `<div class="card"><div class="card-body"><p class="text-2" style="font-size:13px;margin-bottom:12px">Full user and role management lives in <span class="card-link" onclick="navigate('teamaccess')">Team & Access</span>, including the permission matrix.</p><button class="btn btn-soft btn-sm" onclick="navigate('teamaccess')">Open Team & Access</button></div></div>`;
  if(tab==='security')return `<div class="card" style="margin-bottom:16px"><div class="card-head"><h3>Security</h3></div><div class="card-body">${toggleRow('Single sign-on (SSO)','SAML 2.0 via Okta','sec_sso',true)}${toggleRow('Two-factor authentication','Required for finance admins','sec_2fa',true)}${toggleRow('Session timeout','Auto sign-out after 30 min idle','sec_to',true)}</div></div><div class="card"><div class="card-head"><h3>Data & audit</h3></div><div class="card-body"><div class="field"><label>Data retention</label><select class="input" style="max-width:240px"><option>7 years (financial)</option><option>3 years</option></select></div><div class="flex items-center justify-between" style="padding:9px 0"><div><div class="cell-main" style="font-size:12.5px">Audit logs</div><div class="cell-sub">28,104 events this month</div></div><button class="ctrl" onclick="auditDrawer()">View logs</button></div></div></div>`;
  if(tab==='notifications')return `<div class="card"><div class="card-head"><h3>Notifications</h3></div><div class="card-body">${[['Daily revenue briefing','Morning summary to the CFO'],['Critical anomaly alerts','Leakage or discrepancy above threshold'],['Failed payment spikes','Alert when failure rate rises'],['Overdue escalation','Notify on 30/60/90 day ageing'],['Approval requests','Notify approvers of pending items']].map((t,i)=>toggleRow(t[0],t[1],'rnotif_'+i,i<4)).join('')}<div style="margin-top:14px" class="dl-label">Channels</div><div class="flex gap-8 mt-8">${['Email','Slack','In-app'].map(c=>`<span class="badge green">${c} active</span>`).join('')}</div></div></div>`;
  return '';
}

// GLOBAL SEARCH RESULTS PAGE
// ============================================================
renders.search=function(){
  const q=sget('search_q','');const ef=sget('search_entity','all');
  let h=`<div class="content-inner"><div class="page-head"><div><div class="page-title">Search</div><div class="page-sub">Search across customers, subscriptions, invoices, payments and anomalies</div></div></div>`;
  h+=`<div class="card" style="margin-bottom:14px"><div style="padding:12px 14px;display:flex;gap:9px;align-items:center"><div class="search-bar" style="flex:1;cursor:text;background:#fff"><span style="color:var(--text-3)">${svgIcon('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',15)}</span><input id="searchPageInput" value="${q}" oninput="sset('search_q',this.value);renders.search()" placeholder="Search anything..." style="border:none;outline:none;font-family:inherit;font-size:14px;background:none;width:100%"></div><button class="ctrl ${sget('search_adv',false)?'active':''}" onclick="sset('search_adv',!sget('search_adv',false));renders.search()">${svgIcon('<path d="M4 6h16M7 12h10M10 18h4"/>',14)} Filters</button></div></div>`;
  const entities=[['all','All'],['customer','Customers'],['sub','Subscriptions'],['invoice','Invoices'],['payment','Payments'],['anomaly','Anomalies']];
  h+=`<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">${entities.map(e=>`<button class="ctrl ${e[0]===ef?'active':''}" onclick="sset('search_entity','${e[0]}');renders.search()">${e[1]}</button>`).join('')}</div>`;
  const advSt=sget('search_status',''),advMin=sget('search_min','');
  if(sget('search_adv',false)){h+=`<div class="card" style="margin-bottom:14px"><div style="padding:12px 14px;display:flex;gap:9px;flex-wrap:wrap;align-items:center"><span class="dl-label" style="margin:0 4px 0 0">Advanced</span><select class="input" style="width:auto;height:34px" onchange="sset('search_status',this.value);renders.search()"><option value="">Any status</option>${['Active','Past Due','Trial','Overdue','Paid','Failed','Successful','Critical','High','Medium'].map(s=>`<option ${s===advSt?'selected':''}>${s}</option>`).join('')}</select><input class="input" style="width:170px;height:34px" placeholder="Min amount ($)" value="${advMin}" oninput="sset('search_min',this.value);renders.search()">${(advSt||advMin)?`<button class="ctrl" onclick="sset('search_status','');sset('search_min','');renders.search()">Clear</button>`:''}</div></div>`;}
  if(!q){h+=`<div class="empty-state" style="padding:60px">${svgIcon('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',34)}<div>Type to search across every record in Revora</div><div class="text-3" style="font-size:12px;margin-top:6px">Try "overdue", a customer name, or an invoice ID</div></div>`;}
  else{const pA=v=>+(String(v).replace(/[^0-9.]/g,''))||0;const advMinN=pA(advMin);
    let groups=searchAll(q).filter(g=>g.label!=='Modules'&&(ef==='all'||g.items[0]&&matchEntity(g.label,ef)));
    groups=groups.map(g=>({...g,items:g.items.filter(it=>(!advSt||it.status===advSt)&&(!advMinN||pA(it.amount)>=advMinN))})).filter(g=>g.items.length);
    const count=groups.reduce((s,g)=>s+g.items.length,0);
    h+=`<div class="text-2" style="font-size:12.5px;margin-bottom:12px">${count} result${count!==1?'s':''} for "${q}"</div>`;
    if(!count)h+=`<div class="empty-state" style="padding:40px">No matches</div>`;
    groups.forEach(g=>{h+=`<div class="card" style="margin-bottom:14px"><div class="card-head"><h3 style="font-size:13px">${g.label}</h3></div><div style="overflow-x:auto"><table class="tbl"><tbody>${g.items.map(it=>`<tr class="clickable" onclick="routeEntity('${it.type}','${it.id}')"><td style="width:40px">${svgIcon(IC[it.icon]||IC.overview,16)}</td><td class="cell-main" style="font-size:12.5px">${it.label}</td><td class="text-2" style="font-size:12px">${it.sub||''}</td><td style="text-align:right">${it.status?(['Critical','High','Medium','Low'].includes(it.status)?sevBadge(it.status):statusBadge(it.status)):''}</td><td style="text-align:right" class="fw6">${it.amount||''}</td></tr>`).join('')}</tbody></table></div></div>`;});
  }
  h+=`</div>`;
  document.getElementById('content').innerHTML=h;
  const inp=document.getElementById('searchPageInput');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
};
function matchEntity(label,ef){const m={customer:'Customers',sub:'Subscriptions',invoice:'Invoices',payment:'Payments',anomaly:'Revenue anomalies'};return label===m[ef];}

// ---------- INIT ----------
applyOverrides();
if(sget('rail_collapsed',true))document.querySelector('.shell').classList.add('rail-collapsed');
renderNav();
navigate('overview');

</script>
