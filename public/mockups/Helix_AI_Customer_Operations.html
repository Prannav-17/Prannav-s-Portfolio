<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helix AI — Customer Experience OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#F7F8FA;--surface:#FFFFFF;--surface-2:#FBFBFD;
  --side:#111827;--side-2:#1B2436;--side-active:#242F45;--side-hair:rgba(255,255,255,.07);
  --pri:#635BFF;--pri-hover:#514BE0;--pri-soft:#EEEDFF;--pri-tint:#F5F4FF;--pri-ring:rgba(99,91,255,.14);
  --teal:#14B8A6;--teal-soft:#D5F5F0;
  --green:#16A34A;--green-soft:#DCFCE7;--amber:#F59E0B;--amber-soft:#FEF3C7;--red:#EF4444;--red-soft:#FEE2E2;
  --text:#111827;--text-2:#6B7280;--text-3:#9CA3AF;
  --border:#E5E7EB;--border-2:#F0F1F3;
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 4px 12px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.12);
}
html,body{height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;}
.shell{display:flex;height:100vh;overflow:hidden;}
::selection{background:var(--pri-ring);}

/* ============ SIDEBAR ============ */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:244px;background:var(--side);display:flex;flex-direction:column;transition:width .18s ease,box-shadow .18s ease;z-index:40;overflow:hidden;}
.hide-collapse{white-space:nowrap;transition:opacity .13s ease;}
.shell.rail-collapsed .sidebar{width:64px;}
.shell.rail-collapsed .sidebar:hover{width:244px;box-shadow:var(--shadow-lg);}
.shell.rail-collapsed .sidebar:not(:hover) .hide-collapse{display:none;}
.shell.rail-collapsed .sidebar:not(:hover) .nav-item{justify-content:center;padding:9px 0;}
.shell.rail-collapsed .sidebar:not(:hover) .nav-item.active::before{display:none;}
.shell.rail-collapsed .sidebar:not(:hover) .ws-card{justify-content:center;padding:10px 0;}
.shell.rail-collapsed .sidebar:not(:hover) .brand{justify-content:center;}
.shell.rail-collapsed .sidebar:not(:hover) .profile{justify-content:center;padding-left:0;padding-right:0;}
.shell.rail-collapsed .sidebar:not(:hover) .nav-group-title{text-align:center;padding-left:0;padding-right:0;overflow:hidden;}
.brand{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#635BFF,#8B84FF);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(99,91,255,.4);}
.brand-mark svg{width:17px;height:17px;color:#fff;}
.brand-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em;}
.ws-wrap{padding:0 12px 10px;}
.ws-card{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--side-2);cursor:pointer;transition:background .15s;border:1px solid transparent;}
.ws-card:hover{background:var(--side-active);}
.ws-logo{width:26px;height:26px;border-radius:6px;background:#fff;color:var(--side);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
.ws-name{font-size:13px;font-weight:600;color:#fff;line-height:1.1;}
.ws-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:1px;}
.ws-chev{margin-left:auto;color:rgba(255,255,255,.4);}
.nav-scroll{flex:1;overflow-y:auto;padding:4px 12px;}
.nav-scroll::-webkit-scrollbar{width:0;}
.nav-group{margin-bottom:14px;}
.nav-group-title{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.34);padding:4px 10px 6px;letter-spacing:.06em;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;color:rgba(255,255,255,.62);font-size:13px;font-weight:500;transition:all .13s;margin-bottom:1px;position:relative;}
.nav-item:hover{background:var(--side-2);color:rgba(255,255,255,.92);}
.nav-item.active{background:var(--side-active);color:#fff;}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--pri);border-radius:0 3px 3px 0;}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item .nav-badge{margin-left:auto;font-size:10.5px;font-weight:600;background:var(--pri);color:#fff;border-radius:99px;padding:1px 7px;min-width:18px;text-align:center;}
.nav-item .nav-badge.amber{background:var(--amber);}
.profile{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid var(--side-hair);cursor:pointer;transition:background .15s;}
.profile:hover{background:var(--side-2);}
.avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;color:#fff;background:linear-gradient(135deg,#635BFF,#14B8A6);}
.profile-name{font-size:12.5px;font-weight:600;color:#fff;line-height:1.1;}
.profile-role{font-size:11px;color:rgba(255,255,255,.45);margin-top:1px;}

/* ============ MAIN ============ */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;margin-left:244px;transition:margin-left .18s ease;}
.shell.rail-collapsed .main{margin-left:64px;}
.topbar{display:flex;align-items:center;gap:14px;padding:0 24px;height:58px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);flex-shrink:0;z-index:20;}
.hamburger{width:32px;height:32px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);transition:background .15s;}
.hamburger:hover{background:var(--bg);}
.crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-3);}
.crumb b{color:var(--text);font-weight:600;}
.topbar-spacer{flex:1;}
.search-bar{display:flex;align-items:center;gap:9px;padding:0 12px;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text-3);cursor:pointer;min-width:300px;font-size:13px;transition:all .15s;}
.search-bar:hover{border-color:#D1D5DB;background:#fff;}
.search-bar kbd{margin-left:auto;font-size:10.5px;background:#fff;border:1px solid var(--border);padding:1px 6px;border-radius:4px;font-family:inherit;color:var(--text-2);box-shadow:var(--shadow-sm);}
.ask-btn{display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--radius-sm);background:var(--pri);color:#fff;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:all .15s;box-shadow:0 1px 2px rgba(99,91,255,.3);}
.ask-btn:hover{background:var(--pri-hover);box-shadow:0 2px 8px rgba(99,91,255,.35);}
.ask-btn svg{width:15px;height:15px;}
.icon-btn{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);position:relative;transition:all .15s;border:1px solid transparent;}
.icon-btn:hover{background:var(--bg);color:var(--text);}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid #fff;}
.content{flex:1;overflow-y:auto;}
.content-inner{max-width:1360px;margin:0 auto;padding:24px 28px 64px;}

/* ============ PAGE HEADER ============ */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;}
.page-title{font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--text);}
.page-sub{font-size:13.5px;color:var(--text-2);margin-top:3px;}
.page-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}

/* ============ CONTROLS ============ */
.ctrl{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
.ctrl:hover{border-color:#D1D5DB;color:var(--text);}
.ctrl svg{width:14px;height:14px;}
.ctrl.active{background:var(--pri-tint);border-color:var(--pri);color:var(--pri);}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);overflow:hidden;}
.seg button{height:32px;padding:0 13px;border:none;background:none;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--text-2);cursor:pointer;transition:all .12s;}
.seg button+button{border-left:1px solid var(--border);}
.seg button.active{background:var(--pri);color:#fff;}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;white-space:nowrap;}
.btn svg{width:15px;height:15px;}
.btn-pri{background:var(--pri);color:#fff;box-shadow:0 1px 2px rgba(99,91,255,.3);}
.btn-pri:hover{background:var(--pri-hover);}
.btn-ghost{background:var(--surface);color:var(--text-2);border:1px solid var(--border);}
.btn-ghost:hover{border-color:#D1D5DB;color:var(--text);background:var(--surface-2);}
.btn-soft{background:var(--pri-soft);color:var(--pri);}
.btn-soft:hover{background:#E4E2FF;}
.btn-sm{height:30px;padding:0 11px;font-size:12.5px;}
.btn-danger{background:var(--red);color:#fff;}.btn-danger:hover{background:#DC2626;}

/* ============ CARD ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--border-2);}
.card-head h3{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.01em;}
.card-head .sub{font-size:12px;color:var(--text-3);margin-top:1px;font-weight:400;}
.card-body{padding:18px;}
.card-link{font-size:12.5px;font-weight:600;color:var(--pri);cursor:pointer;display:inline-flex;align-items:center;gap:3px;}
.card-link:hover{text-decoration:underline;}

/* ============ KPI ============ */
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);}
.kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:#DADCE2;}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.kpi-label{font-size:11.5px;color:var(--text-2);font-weight:500;}
.kpi-ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--pri-tint);color:var(--pri);}
.kpi-ic svg{width:14px;height:14px;}
.kpi-val{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.1;}
.kpi-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px;}
.delta{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px;}
.delta.up{color:var(--green);background:var(--green-soft);}
.delta.down{color:var(--red);background:var(--red-soft);}
.delta.flat{color:var(--text-2);background:var(--bg);}
.delta svg{width:11px;height:11px;}
.kpi-note{font-size:11px;color:var(--text-3);}
.spark{display:block;}

/* ============ AI BRIEFING ============ */
.briefing{background:linear-gradient(180deg,var(--pri-tint),#fff 60%);border:1px solid #E4E2FF;border-radius:var(--radius);margin-bottom:20px;overflow:hidden;box-shadow:var(--shadow-sm);}
.briefing-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid #ECEBFF;}
.brief-spark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#635BFF,#8B84FF);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 10px rgba(99,91,255,.35);}
.brief-spark svg{width:19px;height:19px;color:#fff;}
.briefing-head h2{font-size:15.5px;font-weight:700;letter-spacing:-.01em;}
.briefing-head p{font-size:12.5px;color:var(--text-2);margin-top:1px;}
.live-pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--teal);background:var(--teal-soft);padding:4px 10px;border-radius:99px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.insight-list{padding:14px 16px;display:flex;flex-direction:column;gap:12px;}
.insight{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;transition:all .18s;position:relative;}
.insight:hover{box-shadow:var(--shadow-md);border-color:#DADCE2;}
.insight.sev-critical{border-left:3px solid var(--red);}
.insight.sev-high{border-left:3px solid var(--amber);}
.insight.sev-medium{border-left:3px solid var(--pri);}
.insight-top{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap;}
.insight-cat{font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;}
.insight-title{font-size:14.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px;}
.insight-body{font-size:13px;color:var(--text-2);line-height:1.55;}
.ai-expl{background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--radius-sm);padding:10px 12px;margin:10px 0;font-size:12.5px;color:var(--text-2);line-height:1.55;}
.ai-expl .lbl{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.ai-expl .lbl svg{width:12px;height:12px;}
.rec-action{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text);margin:10px 0;}
.rec-action svg{width:15px;height:15px;color:var(--teal);flex-shrink:0;margin-top:1px;}
.insight-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px solid var(--border-2);}
.meta-chip{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-2);}
.meta-chip b{color:var(--text);font-weight:600;}
.conf{display:flex;align-items:center;gap:6px;}
.conf-bar{width:46px;height:5px;border-radius:3px;background:var(--border);overflow:hidden;}
.conf-fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--teal));border-radius:3px;}
.insight-actions{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;}

/* ============ BADGES ============ */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.5;}
.badge .bdot{width:5px;height:5px;border-radius:50%;}
.badge.green{background:var(--green-soft);color:var(--green);}
.badge.red{background:var(--red-soft);color:var(--red);}
.badge.amber{background:var(--amber-soft);color:#B45309;}
.badge.indigo{background:var(--pri-soft);color:var(--pri);}
.badge.teal{background:var(--teal-soft);color:#0F766E;}
.badge.gray{background:#F3F4F6;color:var(--text-2);}
.sev{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600;}
.sev.critical{background:var(--red-soft);color:var(--red);}
.sev.high{background:var(--amber-soft);color:#B45309;}
.sev.medium{background:var(--pri-soft);color:var(--pri);}
.sev.low{background:#F3F4F6;color:var(--text-2);}

/* ============ TABLE ============ */
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;font-weight:600;color:var(--text-2);padding:10px 16px;border-bottom:1px solid var(--border);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;background:var(--surface-2);}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--border-2);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr{transition:background .12s;}
.tbl tbody tr.clickable{cursor:pointer;}
.tbl tbody tr.clickable:hover{background:var(--pri-tint);}
.cell-main{font-weight:600;color:var(--text);}
.cell-sub{font-size:11.5px;color:var(--text-3);margin-top:1px;}
.u-cell{display:flex;align-items:center;gap:9px;}
.u-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:10.5px;color:#fff;}
.mini-bar{height:6px;border-radius:3px;background:var(--border-2);overflow:hidden;width:100%;max-width:120px;}
.mini-bar span{display:block;height:100%;border-radius:3px;}

/* ============ FEED ============ */
.feed-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--border-2);}
.feed-item:last-child{border-bottom:none;}
.feed-ic{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.feed-ic svg{width:15px;height:15px;}
.feed-ic.red{background:var(--red-soft);color:var(--red);}
.feed-ic.indigo{background:var(--pri-soft);color:var(--pri);}
.feed-ic.green{background:var(--green-soft);color:var(--green);}
.feed-ic.amber{background:var(--amber-soft);color:#B45309;}
.feed-ic.teal{background:var(--teal-soft);color:#0F766E;}
.feed-txt{font-size:13px;color:var(--text);line-height:1.4;}
.feed-txt b{font-weight:600;}
.feed-time{font-size:11.5px;color:var(--text-3);margin-top:2px;}

/* ============ CHART ============ */
.legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);font-weight:500;}
.legend-swatch{width:9px;height:9px;border-radius:3px;}
.dist-row{display:flex;align-items:center;gap:12px;margin-bottom:13px;}
.dist-row:last-child{margin-bottom:0;}
.dist-label{width:92px;font-size:12.5px;color:var(--text-2);font-weight:500;flex-shrink:0;display:flex;align-items:center;gap:7px;}
.dist-track{flex:1;height:8px;border-radius:4px;background:var(--border-2);overflow:hidden;}
.dist-fill{height:100%;border-radius:4px;transition:width .5s ease;}
.dist-val{width:62px;text-align:right;font-size:12.5px;font-weight:600;color:var(--text);flex-shrink:0;}

/* ============ GRID HELPERS ============ */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid-2-1{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
.row{display:flex;gap:16px;}
.mb-16{margin-bottom:16px;}.mb-20{margin-bottom:20px;}.mt-16{margin-top:16px;}
.section-title{font-size:16px;font-weight:700;letter-spacing:-.01em;margin:4px 0 14px;}

/* ============ DRAWER ============ */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.32);backdrop-filter:blur(1px);z-index:90;opacity:0;visibility:hidden;transition:all .22s;}
.scrim.show{opacity:1;visibility:visible;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:540px;max-width:94vw;background:var(--surface);box-shadow:var(--shadow-lg);z-index:100;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
.drawer.open{transform:translateX(0);}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border);}
.drawer-head h3{font-size:16px;font-weight:700;letter-spacing:-.01em;}
.drawer-head .sub{font-size:12.5px;color:var(--text-3);margin-top:2px;}
.x-btn{width:30px;height:30px;border-radius:var(--radius-xs);border:none;background:none;cursor:pointer;color:var(--text-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
.x-btn:hover{background:var(--bg);}
.drawer-body{flex:1;overflow-y:auto;padding:22px;}
.dl-row{margin-bottom:16px;}
.dl-label{font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.dl-val{font-size:13.5px;color:var(--text);line-height:1.5;}

/* ============ COMMAND PALETTE ============ */
.cmdk-scrim{position:fixed;inset:0;background:rgba(17,24,39,.4);backdrop-filter:blur(3px);z-index:200;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;}
.cmdk-scrim.show{display:flex;}
.cmdk{width:600px;max-width:92vw;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);overflow:hidden;animation:cmdkIn .18s ease;}
@keyframes cmdkIn{from{opacity:0;transform:translateY(-8px) scale(.98);}to{opacity:1;transform:none;}}
.cmdk-input-wrap{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--border);}
.cmdk-input-wrap svg{width:18px;height:18px;color:var(--text-3);}
.cmdk-input{flex:1;border:none;outline:none;font-family:inherit;font-size:15px;color:var(--text);background:none;}
.cmdk-results{max-height:min(380px,54vh);overflow-y:auto;padding:8px;}
.cmdk-group-label{font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;padding:8px 10px 4px;}
.cmdk-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:13.5px;}
.cmdk-item.sel,.cmdk-item:hover{background:var(--pri-tint);}
.cmdk-item svg{width:16px;height:16px;color:var(--text-2);}
.cmdk-item .ci-sub{font-size:11.5px;color:var(--text-3);margin-left:auto;}
.cmdk-empty{padding:28px;text-align:center;color:var(--text-3);font-size:13px;}

/* ============ TOAST ============ */
.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:10px;}
.toast{display:flex;align-items:center;gap:11px;background:var(--side);color:#fff;padding:12px 16px;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);font-size:13px;font-weight:500;min-width:260px;animation:toastIn .25s ease;}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}
.toast svg{width:17px;height:17px;flex-shrink:0;}
.toast .t-ic.green{color:#4ADE80;}.toast .t-ic.indigo{color:#A5A0FF;}.toast .t-ic.amber{color:#FCD34D;}

/* ============ MODAL ============ */
.modal-scrim{position:fixed;inset:0;background:rgba(17,24,39,.4);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center;padding:24px;}
.modal-scrim.show{display:flex;}
.modal{width:480px;max-width:94vw;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);animation:cmdkIn .18s ease;max-height:86vh;overflow-y:auto;}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{font-size:15px;font-weight:700;}
.modal-body{padding:20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px;}
.input,select.input,textarea.input{width:100%;height:36px;padding:0 11px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:inherit;font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:all .15s;}
textarea.input{height:auto;padding:9px 11px;resize:vertical;min-height:76px;line-height:1.5;}
.input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-ring);}

/* ============ TABS ============ */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px;}
.tab{padding:9px 15px;font-size:13px;font-weight:500;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .14s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--pri);border-bottom-color:var(--pri);font-weight:600;}

/* ============ TOGGLE ============ */
.switch{width:38px;height:22px;border-radius:99px;background:var(--border);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.switch.on{background:var(--pri);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:var(--shadow-sm);}
.switch.on::after{transform:translateX(16px);}

/* ============ MISC ============ */
.empty-state{text-align:center;padding:52px 20px;color:var(--text-3);}
.empty-state svg{width:34px;height:34px;margin-bottom:10px;opacity:.5;}
.stub{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 24px;text-align:center;}
.stub .stub-ic{width:52px;height:52px;border-radius:14px;background:var(--pri-tint);color:var(--pri);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.stub .stub-ic svg{width:26px;height:26px;}
.stub h3{font-size:17px;font-weight:700;margin-bottom:6px;}
.stub p{font-size:13.5px;color:var(--text-2);max-width:380px;}
.text-2{color:var(--text-2);}.text-3{color:var(--text-3);}.fw6{font-weight:600;}
.flex{display:flex;}.items-center{align-items:center;}.gap-8{gap:8px;}.gap-12{gap:12px;}.justify-between{justify-content:space-between;}
@media(max-width:1200px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
</style>
</head>

// sparkline SVG
function sparkline(data,color,w=96,h=30){
  const min=Math.min(...data),max=Math.max(...data),rng=(max-min)||1;
  const pts=data.map((v,i)=>[i/(data.length-1)*w, h-4-((v-min)/rng)*(h-8)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${w} ${h} L0 ${h} Z`;
  const gid='sg'+Math.random().toString(36).slice(2,7);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${gid})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

// multi-series line chart
function lineChart(cfg){
  const w=cfg.w||720,h=cfg.h||240,pl=38,pr=14,pt=14,pb=26;
  const iw=w-pl-pr,ih=h-pt-pb;
  const all=cfg.series.flatMap(s=>s.data);
  let max=Math.max(...all),min=Math.min(0,...all);
  max=Math.ceil(max/ (max>1000?500:max>100?50:10))*(max>1000?500:max>100?50:10)||10;
  const n=cfg.labels.length;
  const x=i=>pl+(n===1?iw/2:i/(n-1)*iw);
  const y=v=>pt+ih-((v-min)/(max-min||1))*ih;
  let grid='';
  const gl=4;
  for(let g=0;g<=gl;g++){const gy=pt+ih-(g/gl)*ih;const gv=min+(g/gl)*(max-min);
    grid+=`<line x1="${pl}" y1="${gy.toFixed(1)}" x2="${w-pr}" y2="${gy.toFixed(1)}" stroke="#F0F1F3" stroke-width="1"/>`;
    grid+=`<text x="${pl-8}" y="${gy+3.5}" text-anchor="end" font-size="10" fill="#9CA3AF">${gv>=1000?(gv/1000).toFixed(1)+'k':Math.round(gv)}</text>`;}
  let xlabels='';
  cfg.labels.forEach((l,i)=>{xlabels+=`<text x="${x(i)}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="#9CA3AF">${l}</text>`;});
  let paths='';
  cfg.series.forEach(s=>{
    const pts=s.data.map((v,i)=>[x(i),y(v)]);
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(s.area){const gid='lg'+Math.random().toString(36).slice(2,7);
      paths+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".16"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>`;
      paths+=`<path d="${d} L${x(n-1)} ${pt+ih} L${x(0)} ${pt+ih} Z" fill="url(#${gid})"/>`;}
    paths+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
    paths+=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#fff" stroke="${s.color}" stroke-width="1.8"/>`).join('');
  });
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${grid}${paths}${xlabels}</svg>`;
}

// donut chart
function donut(data,size=150){
  const total=data.reduce((a,b)=>a+b.v,0);const r=size/2,ir=r*0.62;let a0=-Math.PI/2;
  let arcs='';
  data.forEach(d=>{const frac=d.v/total;const a1=a0+frac*Math.PI*2;
    const x0=r+r*Math.cos(a0),y0=r+r*Math.sin(a0),x1=r+r*Math.cos(a1),y1=r+r*Math.sin(a1);
    const xi0=r+ir*Math.cos(a1),yi0=r+ir*Math.sin(a1),xi1=r+ir*Math.cos(a0),yi1=r+ir*Math.sin(a0);
    const large=frac>0.5?1:0;
    arcs+=`<path d="M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1} L${xi0} ${yi0} A${ir} ${ir} 0 ${large} 0 ${xi1} ${yi1} Z" fill="${d.c}"/>`;
    a0=a1;});
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}<text x="${r}" y="${r-2}" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">${total>=1000?(total/1000).toFixed(1)+'k':total}</text><text x="${r}" y="${r+15}" text-anchor="middle" font-size="10.5" fill="#9CA3AF">total</text></svg>`;
}

function distBars(data){
  const max=Math.max(...data.map(d=>d.v));
  return data.map(d=>`<div class="dist-row"><div class="dist-label"><span style="width:8px;height:8px;border-radius:3px;background:${d.c};display:inline-block"></span>${d.k}</div><div class="dist-track"><div class="dist-fill" style="width:${(d.v/max*100).toFixed(0)}%;background:${d.c}"></div></div><div class="dist-val">${fmt(d.v)}</div></div>`).join('');
}

let cmdkSel=0,cmdkItems=[];
function openCmdk(){document.getElementById('cmdkScrim').classList.add('show');const i=document.getElementById('cmdkInput');i.value='';renderCmdk();setTimeout(()=>i.focus(),30);}
function closeCmdk(){document.getElementById('cmdkScrim').classList.remove('show');}
function renderCmdk(){
  const q=document.getElementById('cmdkInput').value.toLowerCase();
  const groups=[];
  const mods=Object.keys(MOD_TITLE).filter(m=>MOD_TITLE[m].toLowerCase().includes(q)||m.includes(q)).map(m=>({type:'mod',id:m,label:MOD_TITLE[m],sub:'Module',icon:NAV.flatMap(g=>g.items).find(i=>i.id===m)?.icon||'overview'}));
  if(mods.length)groups.push({label:'Modules',items:mods.slice(0,5)});
  if(q){
    const tk=(DATA.tickets||[]).filter(t=>(t.id+' '+t.subject+' '+t.customer).toLowerCase().includes(q)).slice(0,4).map(t=>({type:'ticket',id:t.id,label:t.subject,sub:t.id,icon:'tickets'}));
    if(tk.length)groups.push({label:'Tickets',items:tk});
    const ag=DATA.agents.filter(a=>a.name.toLowerCase().includes(q)).slice(0,4).map(a=>({type:'agent',id:a.id,label:a.name,sub:teamName(a.team),icon:'user'}));
    if(ag.length)groups.push({label:'Agents',items:ag});
    const cs=(DATA.customers||[]).filter(c=>c.name.toLowerCase().includes(q)).slice(0,4).map(c=>({type:'customer',id:c.id,label:c.name,sub:c.segment,icon:'customers'}));
    if(cs.length)groups.push({label:'Customers',items:cs});
  }
  cmdkItems=groups.flatMap(g=>g.items);cmdkSel=0;
  let h='';
  if(!cmdkItems.length){h=`<div class="cmdk-empty">No matches for "${document.getElementById('cmdkInput').value}"</div>`;}
  else{let idx=0;groups.forEach(g=>{h+=`<div class="cmdk-group-label">${g.label}</div>`;g.items.forEach(it=>{const i=idx++;h+=`<div class="cmdk-item ${i===0?'sel':''}" data-i="${i}" onmouseover="cmdkHover(${i})" onclick="cmdkGo(${i})">${svgIcon(IC[it.icon]||IC.overview,16)}<span>${it.label}</span><span class="ci-sub">${it.sub}</span></div>`;});});}
  document.getElementById('cmdkResults').innerHTML=h;
}
function cmdkHover(i){cmdkSel=i;document.querySelectorAll('.cmdk-item').forEach(el=>el.classList.toggle('sel',+el.dataset.i===i));}
function cmdkKey(e){
  if(e.key==='ArrowDown'){e.preventDefault();cmdkSel=Math.min(cmdkSel+1,cmdkItems.length-1);}
  else if(e.key==='ArrowUp'){e.preventDefault();cmdkSel=Math.max(cmdkSel-1,0);}
  else if(e.key==='Enter'){e.preventDefault();if(cmdkItems.length)cmdkGo(cmdkSel);return;}
  else if(e.key==='Escape'){closeCmdk();return;}
  document.querySelectorAll('.cmdk-item').forEach(el=>el.classList.toggle('sel',+el.dataset.i===cmdkSel));
  const sel=document.querySelector('.cmdk-item.sel');if(sel)sel.scrollIntoView({block:'nearest'});
}
function cmdkGo(i){const it=cmdkItems[i];if(!it)return;closeCmdk();
  if(it.type==='mod')navigate(it.id);
  else if(it.type==='ticket'){navigate('tickets');setTimeout(()=>openTicket&&openTicket(it.id),60);}
  else if(it.type==='agent'){navigate('coaching');setTimeout(()=>openAgent&&openAgent(it.id),60);}
  else if(it.type==='customer'){navigate('customers');setTimeout(()=>openCustomer&&openCustomer(it.id),60);}
}
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmdk();}
  if(e.key==='Escape'){closeCmdk();closeModal();closeDrawer();}
});

function genConversation(t){
  const c=custById(t.customer);const a=t.agent?agentById(t.agent):null;
  const conv=[{who:'customer',name:c.name,time:'Today 09:14',ch:t.channel,text:openingMsg(t)}];
  if(a){conv.push({who:'agent',name:a.name,time:'Today 09:22',text:`Hi ${c.name.split(' ')[0]}, thanks for reaching out — I'm looking into this now and will update you shortly.`});
    conv.push({who:'customer',name:c.name,time:'Today 09:40',ch:t.channel,text:followupMsg(t)});
    if(t.status!=='Open')conv.push({who:'note',name:a.name,time:'Today 09:45',text:internalNote(t)});}
  return conv;
}
function openingMsg(t){const map={Payments:`I tried to pay for my order but the payment failed — however the amount has been debited from my account. Order reference is ${t.id.replace('TK','ORD')}. Please help, this is urgent.`,Returns:`I raised a return over a week ago and still haven't received my refund. The status hasn't moved at all. Can someone please look into ${t.id}?`,Delivery:`My order still hasn't arrived and the tracking hasn't updated in days. I need this resolved today.`,Orders:`There's an issue with my order and the previous response didn't actually solve it. I'm quite frustrated at this point.`,Product:`I'm facing a problem with the product/app — "${t.subject}". It's blocking me from completing my purchase.`};return map[t.category]||t.subject;}
function followupMsg(t){return t.sentiment==='Negative'?`This has been going on too long and it's affecting my experience. I'd like a clear timeline, please.`:`Thanks — could you let me know roughly how long this will take?`;}
function internalNote(t){return `Internal: Confirmed the issue on our side. ${t.category==='Payments'?'Gateway callback timeout suspected — flagged to Payments Eng.':t.category==='Returns'?'Refund stuck in processing queue, raised with finance.':'Following up with the responsible team.'} Keeping customer updated.`;}

function aiBox(title,body){return `<div class="card"><div class="card-head" style="padding:12px 15px"><div class="flex items-center gap-8"><span style="color:var(--pri)">${svgIcon(IC.sparkle,14)}</span><h3 style="font-size:13px">${title}</h3></div></div><div class="card-body" style="padding:13px 15px;font-size:12.5px;line-height:1.55">${body}</div></div>`;}
function ticketAIPanel(t,c){
  const churn=c.risk==='High'?68:c.risk==='Medium'?34:12;const breach=t.sla!==null&&t.sla<0?92:t.sla!==null&&t.sla<30?64:18;const repeat=t.sentiment==='Negative'?44:19;

  h+=aiBox('Sentiment analysis',`<div class="flex items-center justify-between"><span class="badge ${t.sentiment==='Negative'?'red':t.sentiment==='Positive'?'green':'gray'}">${t.sentiment}</span><span class="text-3" style="font-size:11px">trend ${t.sentiment==='Negative'?'↓ worsening':'→ stable'}</span></div><div style="margin-top:10px"><div class="flex justify-between" style="font-size:12px;margin-bottom:4px"><span class="text-2">Escalation risk</span><b>${t.sentiment==='Negative'?'High':'Low'}</b></div><div class="mini-bar" style="max-width:none"><span style="width:${t.sentiment==='Negative'?80:25}%;background:${t.sentiment==='Negative'?'var(--red)':'var(--green)'}"></span></div></div>`);
  const sug=suggestedResponse(t,c);
  h+=aiBox('Suggested response',`<div style="background:var(--surface-2);border:1px solid var(--border-2);border-radius:8px;padding:10px;font-style:italic;color:var(--text-2)">"${sug}"</div><div class="text-3" style="font-size:11px;margin-top:8px">Why: matches the customer's ${t.sentiment.toLowerCase()} tone and leads with acknowledgement before the fix.</div><button class="btn btn-soft btn-sm" style="width:100%;margin-top:10px" onclick="insertSuggested()">Use this response</button>`);
  h+=aiBox('Knowledge recommendations',`${[t.category==='Payments'?'Resolving debited-but-failed UPI payments':t.category==='Returns'?'Refund timelines and escalation path':'Tracking a delayed shipment','Issuing a goodwill credit','Escalation criteria for '+t.category].map(k=>`<div class="flex items-center gap-8" style="padding:6px 0;border-bottom:1px solid var(--border-2)">${svgIcon('<path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>',13)}<span class="card-link" style="color:var(--text);font-weight:500" onclick="toast('Opened KB article','indigo')">${k}</span></div>`).join('')}`);
  h+=aiBox('Resolution guidance',`<b>Recommended next action:</b> ${t.category==='Payments'?'Verify the debit against the gateway log; if unmatched, trigger auto-refund and confirm to customer.':t.category==='Returns'?'Push the refund manually and share the reference + ETA.':'Contact the delivery partner and give the customer a firm update.'}<div style="margin-top:8px"><span class="text-2">Similar resolved: </span><span class="card-link" onclick="toast('Opened similar ticket','indigo')">TK-4689</span>, <span class="card-link" onclick="toast('Opened similar ticket','indigo')">TK-4702</span></div>`);
  h+=aiBox('Ticket risk',`${[['SLA breach probability',breach],['Customer churn risk',churn],['Repeat contact probability',repeat]].map(r=>`<div style="margin-bottom:10px"><div class="flex justify-between" style="font-size:12px;margin-bottom:3px"><span class="text-2">${r[0]}</span><b style="color:${r[1]>60?'var(--red)':r[1]>30?'var(--amber)':'var(--green)'}">${r[1]}%</b></div><div class="mini-bar" style="max-width:none"><span style="width:${r[1]}%;background:${r[1]>60?'var(--red)':r[1]>30?'var(--amber)':'var(--green)'}"></span></div></div>`).join('')}`);
  return h;
}
function suggestedResponse(t,c){const f=c.name.split(' ')[0];return t.category==='Payments'?`Hi ${f}, I completely understand how worrying a debited-but-failed payment is. I've located the transaction and can confirm no order was placed, so I'm issuing a full refund now — you'll see it within 3–5 business days, reference below. I'll stay on this until it's settled.`:t.category==='Returns'?`Hi ${f}, I'm sorry the refund has taken this long — that's not the experience we want. I've pushed it through manually just now and you'll receive it within 48 hours. Here's your reference, and I'll personally confirm once it lands.`:`Hi ${f}, thanks for your patience. I've taken ownership of this and here's exactly what happens next, with a clear timeline so you're not left guessing.`;}

function invInterventions(i){

function askAnswer(q){
  q=q.toLowerCase();
  if(q.includes('csat')||q.includes('decline'))return{a:`CSAT fell 2.1 pts this week, driven mainly by the <b>6 PM–10 PM shift</b> (93% → 81%) and <b>delayed refunds</b> in Returns & Refunds. Most negative feedback cites incomplete resolution explanations.`,ev:['Evening-shift CSAT drop (IN-02)','Returns complaints up 42% (IN-04)'],act:'Run targeted coaching on the evening shift and fix the refund processing delay.',tickets:['TK-4790','TK-4801']};
  if(q.includes('coach')||q.includes('agent'))return{a:`Two agents need immediate attention: <b>Rahul Sharma</b> (CSAT 82.4%, quality 74) and <b>Imran Khan</b> (CSAT 79.8%, quality 71). Both show strong response speed but weak resolution-explanation quality on returns.`,ev:['Agent quality scores below 75','8 of 12 low-rated chats lacked acknowledgement'],act:'Open coaching sessions for Rahul and Imran focused on empathy.',tickets:[]};
  if(q.includes('complaint')||q.includes('top'))return{a:`Top 3 complaint drivers right now: <b>1) Delayed refunds</b> (Returns), <b>2) UPI payment failures</b> (Payments), <b>3) Stalled deliveries</b> with no tracking updates.`,ev:['Returns +42%','Payments +34% in 6h','Delivery tracking gap'],act:'Prioritise the refund integration fix — it has the widest customer impact.',tickets:['TK-4801','TK-4821']};
  if(q.includes('segment')||q.includes('risk')||q.includes('churn'))return{a:`<b>Enterprise, high-LTV</b> customers are most at risk: 9 accounts in the top LTV decile have 3+ unresolved interactions in 14 days with declining sentiment — a pattern that historically precedes downgrade.`,ev:['9 high-value churn signals (IN-05)'],act:'Assign a senior agent to each at-risk account and open proactive outreach.',tickets:['TK-4760','TK-4772']};
  if(q.includes('7 day')||q.includes('changed')||q.includes('week'))return{a:`Over the last 7 days: first response time improved 12% and AI resolution rose 5.4 pts, but <b>CSAT slipped 2.1 pts</b> and <b>Returns backlog grew</b>. Net: efficiency up, experience slightly down, concentrated in Returns.`,ev:['FRT -12%','AI resolution +5.4pts','CSAT -2.1pts'],act:'Protect CSAT by rebalancing Returns workload.',tickets:[]};
  if(q.includes('most customer')||q.includes('affect'))return{a:`The widest-reaching open issue is the <b>UPI payment failure</b> (186 customers in 6 hours), followed by <b>returns refund delays</b> (97 customers over 7 days).`,ev:['Payment failures (IN-01)','Returns complaints (IN-04)'],act:'Escalate the payment issue to engineering immediately.',tickets:['TK-4821','TK-4822']};
  return{a:`I can answer questions about CSAT, agent coaching, complaint drivers, at-risk segments, weekly changes and the issues affecting the most customers. Try one of the suggested prompts.`,ev:[],act:null,tickets:[]};
}

    <div class="card-body" id="askScroll" style="flex:1;overflow-y:auto">`;
  if(!askHistory.length){h+=`<div class="empty-state" style="padding:40px 20px"><div class="brief-spark" style="width:40px;height:40px;margin:0 auto 12px">${svgIcon(IC.sparkle,20)}</div><div style="font-weight:600;color:var(--text)">Ask anything about your support operation</div><div style="font-size:12.5px;margin-top:4px">Helix answers from live ticket, agent and customer data.</div></div>`;}

    else{h+=`<div style="display:flex;gap:10px;margin-bottom:16px"><div class="brief-spark" style="width:28px;height:28px;flex-shrink:0">${svgIcon(IC.sparkle,15)}</div><div style="max-width:82%"><div style="background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.55">${m.a}${m.ev&&m.ev.length?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-2)"><div class="dl-label">Supporting evidence</div>${m.ev.map(e=>`<div style="font-size:12px;color:var(--text-2);padding:2px 0">• ${e}</div>`).join('')}</div>`:''}${m.act?`<div class="rec-action" style="margin:10px 0 0">${svgIcon(IC.check,15)}<span><b>Recommended:</b> ${m.act}</span></div>`:''}${m.tickets&&m.tickets.length?`<div style="margin-top:8px">${m.tickets.map(t=>`<span class="badge indigo" style="cursor:pointer;margin-right:4px" onclick="openTicket('${t}')">${t}</span>`).join('')}</div>`:''}</div></div></div>`;}
  });
  h+=`</div>
    <div style="border-top:1px solid var(--border);padding:12px 16px">
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px">${ASK_PROMPTS.slice(0,3).map(p=>`<button class="ctrl" style="font-size:12px" onclick="askSend(\`${p}\`)">${p}</button>`).join('')}</div>
      <div class="flex gap-8"><input class="input" id="askInput" placeholder="Ask Helix about your support data..." onkeydown="if(event.key==='Enter')askSend(this.value)"><button class="btn btn-pri" onclick="askSend(document.getElementById('askInput').value)">Send</button></div>
    </div></div>`;
  // side suggested prompts + history
  h+=`<div style="display:flex;flex-direction:column;gap:14px">
    <div class="card"><div class="card-head" style="padding:12px 15px"><h3 style="font-size:13px">Suggested prompts</h3></div><div class="card-body" style="padding:8px">${ASK_PROMPTS.map(p=>`<div class="cmdk-item" style="font-size:12.5px" onclick="askSend(\`${p}\`)">${svgIcon(IC.sparkle,14)}<span>${p}</span></div>`).join('')}</div></div>
  </div>`;
  h+=`</div>`;
  return h;
}
function askSend(q){q=(q||'').trim();if(!q)return;const ans=askAnswer(q);askHistory.push({role:'user',text:q});askHistory.push({role:'helix',...ans});renders.insights('assistant');}

const QDIMS=['Empathy','Accuracy','Communication clarity','Resolution effectiveness','Policy compliance','Ownership','Professionalism'];

function saveCoach(id){const focus=document.getElementById('cf').value,ex=document.getElementById('ce').value,goal=document.getElementById('cg').value,due=document.getElementById('cd').value;

function completeSession(id,ts){const list=sget('coach_'+id,[]);const s=list.find(x=>x.ts===ts);if(s)s.done=true;sset('coach_'+id,list);openAgent(id);toast('Session marked complete','green');}

      <div class="text-3" style="font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">${openingMsg(t).slice(0,54)}…</div>

  h+=`</div></div>`;
  document.getElementById('content').innerHTML=h;

    <div class="dl-label" style="margin-top:8px">Preferences</div><div class="text-2" style="font-size:12.5px">Prefers ${tks[0]?tks[0].channel:'Email'} · ${c.segment==='Enterprise'?'Dedicated support line':'Standard support'}</div>
  </div></div>`;
  // right
  h+=`<div>`;
  h+=`<div class="card" style="margin-bottom:16px;border-color:#E4E2FF"><div class="card-head" style="background:var(--pri-tint)"><div class="flex items-center gap-8"><span style="color:var(--pri)">${svgIcon(IC.sparkle,15)}</span><h3>AI customer summary</h3></div></div><div class="card-body" style="font-size:13px;line-height:1.6">
    ${c.name.split(' ')[0]} is ${/^[aeiou]/.test(c.segment)?'an':'a'} <b>${c.segment.toLowerCase()}</b> customer with ${c.tickets} lifetime contacts. ${c.risk==='High'?`Helix flags <b>elevated churn risk</b>: ${tks.filter(t=>t.status!=='Resolved').length} open issues and a declining sentiment trend over the last interactions.`:c.risk==='Medium'?`Sentiment has dipped recently — worth a proactive check-in.`:`Healthy relationship with consistent positive sentiment.`} ${tks.filter(t=>t.sentiment==='Negative').length>1?'Repeated complaints centre on refunds and delivery.':''}
  </div></div>`;
  // sentiment timeline (simple)
  h+=`<div class="card" style="margin-bottom:16px"><div class="card-head"><h3 style="font-size:13px">Sentiment timeline</h3></div><div class="card-body">${lineChart({labels:['Jun','Jul','Aug','Sep','Oct','Nov'],h:150,series:[{data:c.risk==='High'?[82,78,70,62,55,48]:c.risk==='Medium'?[80,78,76,72,70,68]:[85,87,88,90,91,c.csat],color:c.risk==='High'?'#EF4444':c.risk==='Medium'?'#F59E0B':'#16A34A',area:true}]})}</div></div>`;
  // ticket history
  h+=`<div class="card"><div class="card-head"><h3 style="font-size:13px">Ticket history</h3><div class="sub">${tks.length} tickets</div></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Ticket</th><th>Subject</th><th>Category</th><th>Status</th></tr></thead><tbody>`;
  tks.forEach(t=>{h+=`<tr class="clickable" onclick="openTicket('${t.id}')"><td class="cell-main" style="font-size:12.5px">${t.id}</td><td style="font-size:12.5px">${t.subject}</td><td><span class="badge gray">${t.category}</span></td><td>${statusBadge(t.status)}</td></tr>`;});
  h+=`</tbody></table></div></div>`;
  h+=`</div></div></div>`;
  document.getElementById('content').innerHTML=h;
  document.getElementById('content').scrollTop=0;
};

renders.analytics=function(){
  document.getElementById('content').style.overflow='';
  let h=`<div class="content-inner">`;
  h+=`<div class="page-head"><div><div class="page-title">Analytics</div><div class="page-sub">Reporting across support, experience, channels and AI effectiveness.</div></div><div class="page-actions"><button class="ctrl">Last 30 days ${svgIcon('<path d="M6 9l6 6 6-6"/>',14)}</button><button class="btn btn-ghost btn-sm" onclick="toast('Report exported','green')">Export</button></div></div>`;
  // AI narrative
  h+=`<div class="briefing" style="margin-bottom:20px"><div class="briefing-head"><div class="brief-spark">${svgIcon(IC.sparkle,19)}</div><div><h2 style="font-size:14px">Helix narrative</h2><p>The most important changes this period</p></div></div><div style="padding:14px 18px;font-size:13.5px;line-height:1.6">First response time improved <b>12%</b> and AI resolution rose <b>5.4 pts</b> — efficiency is up. But <b>CSAT slipped 2.1 pts</b>, concentrated in Returns & Refunds where backlog grew. The single biggest lever this month is fixing refund processing latency, which drives both the CSAT dip and the complaint spike.</div></div>`;
  // support performance
  h+=`<div class="section-title">Support performance</div><div class="grid-2 mb-20">
    <div class="card"><div class="card-head"><h3 style="font-size:13px">Ticket volume (incoming vs resolved)</h3></div><div class="card-body">${lineChart({labels:['W1','W2','W3','W4'],h:190,series:[{data:[3600,3850,4100,3936],color:'#635BFF',area:true},{data:[3500,3700,3980,4010],color:'#14B8A6'}]})}</div></div>
    <div class="card"><div class="card-head"><h3 style="font-size:13px">SLA compliance trend</h3></div><div class="card-body">${lineChart({labels:['W1','W2','W3','W4'],h:190,series:[{data:[94,92,90,91],color:'#16A34A',area:true}]})}</div></div>
  </div>`;
  // operational distributions
  h+=`<div class="section-title">Operational</div><div class="grid-3 mb-20">
    <div class="card"><div class="card-head"><h3 style="font-size:13px">Peak hours</h3></div><div class="card-body">${lineChart({labels:['9','12','15','18','21'],h:160,series:[{data:[40,92,78,86,52],color:'#635BFF',area:true}]})}</div></div>
    <div class="card"><div class="card-head"><h3 style="font-size:13px">By channel</h3></div><div class="card-body" style="display:flex;justify-content:center">${donut(DATA.distChannel.map(d=>({v:d.v,c:d.c})),130)}</div></div>
    <div class="card"><div class="card-head"><h3 style="font-size:13px">Team capacity</h3></div><div class="card-body">${DATA.teams.map(t=>`<div class="dist-row"><div class="dist-label" style="width:120px">${t.name}</div><div class="dist-track"><div class="dist-fill" style="width:${Math.min(100,t.workload/3.5)}%;background:${t.workload>300?'var(--amber)':'var(--pri)'}"></div></div></div>`).join('')}</div></div>
  </div>`;
  // AI effectiveness
  h+=`<div class="section-title">AI effectiveness</div><div class="kpi-grid" style="grid-template-columns:repeat(6,1fr)">`;
  [['AI resolution rate','38.6%'],['AI-assisted responses','61%'],['Recommendation acceptance','74%'],['Containment rate','42%'],['Human escalation','23%'],['Time saved','1,240h']].forEach(k=>{h+=`<div class="kpi" style="cursor:default"><div class="kpi-label">${k[0]}</div><div class="kpi-val" style="font-size:22px;margin-top:6px;color:var(--pri)">${k[1]}</div></div>`;});
  h+=`</div>`;
  h+=`</div>`;
  document.getElementById('content').innerHTML=h;
};

// AUTOMATIONS
// ============================================================
DATA.automations=[
  {id:'AU1',name:'SLA Protection',status:true,trigger:'Ticket has <15 min to SLA breach',cond:'Priority is High or Critical',action:'Notify team lead + escalate priority',runs:214,success:98},
  {id:'AU2',name:'Negative Sentiment Detection',status:true,trigger:'Sentiment turns highly negative',cond:'Customer contacted >2× in 24h',action:'Escalate to senior agent',runs:86,success:94},
  {id:'AU3',name:'Emerging Issue Detection',status:true,trigger:'Sudden ticket spike in a category',cond:'—',action:'Generate AI insight + notify manager',runs:37,success:100},
  {id:'AU4',name:'High-Value Customer Protection',status:false,trigger:'High-value customer submits a complaint',cond:'LTV in top decile',action:'Prioritise + assign senior agent',runs:52,success:96},
];
renders.automations=function(){
  document.getElementById('content').style.overflow='';
  let h=`<div class="content-inner">`;
  h+=`<div class="page-head"><div><div class="page-title">Automations</div><div class="page-sub">Trigger → Condition → Action workflows that run your playbook automatically.</div></div><div class="page-actions"><button class="btn btn-pri btn-sm" onclick="toast('Workflow builder (demo)','indigo')">+ New automation</button></div></div>`;
  DATA.automations.forEach(a=>{const on=sget('auto_'+a.id,a.status);
    h+=`<div class="card" style="margin-bottom:14px"><div class="card-body">
      <div class="flex items-center gap-12" style="margin-bottom:14px"><div style="width:34px;height:34px;border-radius:8px;background:var(--pri-tint);color:var(--pri);display:flex;align-items:center;justify-content:center">${svgIcon(IC.automations,17)}</div>
        <div><div style="font-weight:700;font-size:14px">${a.name}</div><div class="text-3" style="font-size:12px">${fmt(a.runs)} runs · ${a.success}% success</div></div>
        <div style="margin-left:auto" class="flex items-center gap-12"><span class="badge ${on?'green':'gray'}">${on?'Active':'Paused'}</span><div class="switch ${on?'on':''}" onclick="sset('auto_${a.id}',${!on});renders.automations();toast('${a.name} ${on?'paused':'activated'}','${on?'amber':'green'}')"></div></div></div>
      <div style="display:flex;align-items:stretch;gap:10px;flex-wrap:wrap">
        ${autoBlock('Trigger',a.trigger,'#635BFF')}
        ${autoArrow()}
        ${autoBlock('Condition',a.cond==='—'?'Always':a.cond,'#F59E0B')}
        ${autoArrow()}
        ${autoBlock('Action',a.action,'#14B8A6')}
      </div></div></div>`;});
  h+=`</div>`;
  document.getElementById('content').innerHTML=h;
};
function autoBlock(label,text,color){return `<div style="flex:1;min-width:200px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;border-top:3px solid ${color}"><div class="dl-label" style="color:${color}">${label}</div><div style="font-size:13px;font-weight:500;margin-top:4px;line-height:1.4">${text}</div></div>`;}
function autoArrow(){return `<div style="display:flex;align-items:center;color:var(--text-3)">${svgIcon('<path d="M5 12h14M13 6l6 6-6 6"/>',18)}</div>`;}

renders.team=function(){
  document.getElementById('content').style.overflow='';
  let h=`<div class="content-inner">`;
  h+=`<div class="page-head"><div><div class="page-title">Team & Agents</div><div class="page-sub">${DATA.teams.length} teams · ${DATA.agents.length} agents</div></div><div class="page-actions"><button class="btn btn-ghost btn-sm" onclick="toast('Add agent (demo)','indigo')">+ Add agent</button></div></div>`;
  // teams
  h+=`<div class="section-title">Teams</div><div class="grid-2 mb-20">`;
  DATA.teams.forEach(t=>{h+=`<div class="card"><div class="card-body"><div class="flex items-center justify-between" style="margin-bottom:12px"><div><div style="font-weight:700;font-size:14px">${t.name}</div><div class="text-3" style="font-size:12px">Lead: ${t.lead} · ${t.agents} agents</div></div><span class="badge ${t.sla>=92?'green':t.sla>=85?'amber':'red'}">${t.sla}% SLA</span></div>
    <div style="display:flex;gap:16px"><div><div class="text-3" style="font-size:11px">Workload</div><div class="fw6">${t.workload}</div></div><div><div class="text-3" style="font-size:11px">Avg CSAT</div><div class="fw6">${t.csat}%</div></div></div>
    <div class="dist-track" style="margin-top:10px"><div class="dist-fill" style="width:${Math.min(100,t.workload/3.5)}%;background:${t.workload>300?'var(--amber)':'var(--pri)'}"></div></div></div></div>`;});
  h+=`</div>`;
  // agents
  h+=`<div class="section-title">Agents</div><div class="card"><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Agent</th><th>Team</th><th>Role</th><th>CSAT</th><th>Capacity</th><th>Status</th><th></th></tr></thead><tbody>`;
  DATA.agents.forEach(a=>{h+=`<tr><td><div class="u-cell">${avatar(a.name)}<span class="cell-main" style="font-size:12.5px">${a.name}</span></div></td><td class="text-2">${teamName(a.team)}</td><td>${a.role}</td><td><b>${a.csat}%</b></td>
    <td><div class="flex items-center gap-8"><div class="mini-bar" style="max-width:80px"><span style="width:${Math.round(a.assigned/80*100)}%;background:var(--pri)"></span></div><span style="font-size:11.5px" class="text-2">${a.assigned}/80</span></div></td>
    <td><span class="badge green">Active</span></td><td style="text-align:right"><button class="ctrl" onclick="openAgent('${a.id}')">View</button></td></tr>`;});
  h+=`</tbody></table></div></div></div>`;
  document.getElementById('content').innerHTML=h;
};
